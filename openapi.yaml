openapi: 3.1.0
info:
  title: Crimson Citadel 저장 서버 API
  version: 1.0.0
  description: |
    붉은 달의 성채(Crimson Citadel) 게임의 체크포인트 저장 서버 API다.
    전투 계산, 적 배치, 보상과 층 전이는 게임 클라이언트가 담당하고,
    서버는 게임과 그 덱을 저장·조회하는 CRUD만 제공한다.

    ## 한눈에 보기

    | 메서드 | 경로 | 성공 | 하는 일 |
    | --- | --- | ---: | --- |
    | `POST` | `/games` | `201` | 게임과 시작 덱 생성 |
    | `GET` | `/games` | `200` | 게임 요약 목록 (ID 내림차순) |
    | `GET` | `/games/{gameId}` | `200` | 게임 상세와 전체 덱 |
    | `PATCH` | `/games/{gameId}` | `204` | 플레이어 이름 변경 |
    | `PUT` | `/games/{gameId}/progress` | `200` | 진행 필드와 전체 덱 저장 |
    | `DELETE` | `/games/{gameId}` | `204` | 게임과 덱 삭제 |
    | `GET` | `/games/search` | `200` | 조건 검색과 페이징 |
    | `GET` | `/games/stats` | `200` | 전체 기록 집계 |

    ## 오류 응답

    실패한 요청은 상태 코드와 함께 아래 형식의 본문을 돌려준다. `message`는 사람이 읽을 수 있는
    원인 설명이며, 게임 클라이언트는 이 문자열을 화면에 그대로 표시한다.

    | 상태 | 언제 |
    | ---: | --- |
    | `400` | 요청 본문 형식, enum 값 또는 필드 제약 위반 |
    | `404` | 존재하지 않는 게임 ID |
    | `409` | 이미 끝난 게임에 대한 진행 저장 |

    <SchemaDefinition schemaRef="#/components/schemas/ErrorResponse" />

    ## 선택 기능

    `GET /games/search`와 `GET /games/stats`는 없어도 되는 API다. 서버가 `404`를 반환하면
    클라이언트는 목록 페이징과 기록판을 숨기고 전체 목록으로 동작한다.

    ## 카드 타입

    `cardType`에 들어가는 값이다. 서버는 문자열로 저장만 하고, 카드의 효과와 표시 이름은 게임
    클라이언트가 정한다. 시작 덱은 `STRIKE` 2장, `HEART_PIERCE`, `GUARD`, `MIST_KNOT`, `QUICK_SLASH`,
    `WARDING_SLASH`, `BLOOD_RUNE`, `MEND` 9장이다.

    | 값 | 카드 |
    | --- | --- |
    | `STRIKE` | 베기 |
    | `GUARD` | 밤의 장막 |
    | `MIST_KNOT` | 안개 매듭 |
    | `HEAVY_BLOW` | 내리베기 |
    | `TENDON_SEVER` | 힘줄 끊기 |
    | `TWIN_SLASH` | 쌍베기 |
    | `QUICK_SLASH` | 빠른 베기 |
    | `IRON_WALL` | 안개 장막 |
    | `BLOOD_RUNE` | 흡수 |
    | `ECHO_GUARD` | 피의 방패 |
    | `SUNDER` | 난도질 |
    | `MEND` | 피의 갈증 |
    | `COUNTER_SIGIL` | 혈흔 각인 |
    | `ARCANE_BOLT` | 혈창 |
    | `WARDING_SLASH` | 안개 베기 |
    | `RUNE_SURGE` | 피의 계약 |
    | `SHATTER_BOLT` | 혈흔 절개 |
    | `EXECUTION_RUNE` | 혈폭풍 |
    | `BLOOD_AMPLIFY` | 피의 증폭 |
    | `LAST_STAND` | 불사의 밤 |
    | `DECAPITATE` | 참수 |
    | `NIGHT_DANCE` | 밤의 검무 |
    | `MIST_FORM` | 안개 형상 |
    | `NIGHT_FEAST` | 밤의 만찬 |
    | `SCARLET_MEMORY` | 붉은 기억 |
    | `BLOOD_OFFERING` | 피의 공물 |
    | `SEALED_WOUND` | 닫히지 않는 상처 |
    | `THIRSTING_BLOW` | 갈증의 일격 |
    | `BLOOD_TOLL` | 피의 대가 |
    | `NIGHT_TITHE` | 밤의 징수 |
    | `CRIMSON_RECLAIM` | 붉은 회수 |
    | `HEART_PIERCE` | 심장찌르기 |
    | `SHATTER_ARMOR` | 갑주 파쇄 |
    | `VOID_NIGHT` | 무형의 밤 |
    | `NIGHT_AFTERIMAGE` | 밤의 잔영 |
    | `KILLING_MOMENTUM` | 살의의 고조 |
    | `LINGERING_THUNDER` | 잔뢰 |
    | `SECOND_HEART` | 두 번째 심장 |
servers:
  - url: http://localhost:8080
tags:
  - name: 게임
    description: 게임 생성, 조회, 이름 변경, 진행 저장, 삭제
  - name: 검색
    description: 조건 검색·페이징과 전체 기록 집계

paths:
  /games:
    post:
      tags: [게임]
      summary: 게임 생성
      description: |
        플레이어 이름과 시작 덱으로 새 게임을 만든다. 덱은 요청 순서대로 저장된다.
        `currentHp=99`, `currentFloor=1`, `phase=REWARD`, `status=PLAYING`으로 초기화한다.
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
            example:
              playerName: 밤의 후계자
              deck:
                - { cardType: STRIKE, acquiredFloor: 0 }
                - { cardType: STRIKE, acquiredFloor: 0 }
                - { cardType: HEART_PIERCE, acquiredFloor: 0 }
                - { cardType: GUARD, acquiredFloor: 0 }
                - { cardType: MIST_KNOT, acquiredFloor: 0 }
                - { cardType: QUICK_SLASH, acquiredFloor: 0 }
                - { cardType: WARDING_SLASH, acquiredFloor: 0 }
                - { cardType: BLOOD_RUNE, acquiredFloor: 0 }
                - { cardType: MEND, acquiredFloor: 0 }
      responses:
        '201':
          description: 생성된 게임의 상세
          headers:
            Location:
              description: 생성된 게임의 경로 (`/games/{id}`). 선택 헤더로, 없어도 클라이언트는 동작한다.
              schema:
                type: string
                example: /games/12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
              example:
                $ref: '#/components/examples/GameDetailCreated/value'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [게임]
      summary: 게임 목록 조회
      description: 저장된 모든 게임을 ID 내림차순으로 반환한다. 덱은 포함하지 않는다. 없으면 빈 배열이다.
      operationId: getGames
      responses:
        '200':
          description: 게임 요약 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameSummaryResponse'
              example:
                - id: 12
                  playerName: 밤의 후계자
                  currentFloor: 4
                  currentHp: 61
                  phase: BATTLE
                  status: PLAYING
                  deckSize: 12
                  createdAt: '2026-09-03T18:20:11'
                  updatedAt: '2026-09-03T19:02:45'
                - id: 11
                  playerName: 붉은 순례자
                  currentFloor: 10
                  currentHp: 0
                  phase: FINISHED
                  status: FAILED
                  deckSize: 15
                  createdAt: '2026-09-02T21:10:03'
                  updatedAt: '2026-09-02T22:48:39'

  /games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [게임]
      summary: 게임 상세 조회
      description: 게임 한 건과 전체 덱을 반환한다. 덱은 카드 ID 오름차순이다.
      operationId: getGame
      responses:
        '200':
          description: 게임 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
              example:
                $ref: '#/components/examples/GameDetailProgress/value'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [게임]
      summary: 플레이어 이름 변경
      description: 선택한 게임의 `playerName`만 변경한다. 다른 필드는 바뀌지 않는다.
      operationId: renameGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
            example:
              playerName: 붉은 순례자
      responses:
        '204':
          description: 변경 완료. 본문 없음.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [게임]
      summary: 게임 삭제
      description: 게임과 그에 속한 모든 카드를 삭제한다.
      operationId: deleteGame
      responses:
        '204':
          description: 삭제 완료. 본문 없음.
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/progress:
    parameters:
      - $ref: '#/components/parameters/GameId'
    put:
      tags: [게임]
      summary: 진행과 전체 덱 저장
      description: |
        HP, 층, 단계, 상태와 **전체 덱**을 저장한다. `deck`은 추가할 카드가 아니라
        저장할 덱 전체다.

        게임 필드 갱신과 덱 교체는 원자적으로 처리된다. 기존 카드는 모두 제거되고
        요청의 덱이 순서대로 저장되므로, 같은 본문을 반복해 보내도 카드 수가 늘지 않는다.
        카드 ID는 교체할 때 새로 발급되므로 클라이언트는 응답의 덱을 사용한다.
      operationId: updateProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
            example:
              currentHp: 47
              currentFloor: 5
              phase: REWARD
              status: PLAYING
              deck:
                - { cardType: STRIKE, acquiredFloor: 0 }
                - { cardType: HEART_PIERCE, acquiredFloor: 0 }
                - { cardType: SHATTER_BOLT, acquiredFloor: 2 }
      responses:
        '200':
          description: 교체된 카드 ID가 담긴 게임 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
              example:
                $ref: '#/components/examples/GameDetailProgress/value'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 이미 끝난(`CLEARED`/`FAILED`) 게임에는 진행을 저장할 수 없다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                error: Conflict
                message: 이미 끝난 여정은 진행을 저장할 수 없습니다. id=12
                path: /games/12/progress

  /games/search:
    get:
      tags: [검색]
      summary: 게임 조건 검색과 페이징
      description: |
        상태, 최소 층, 이름 키워드 조건을 조합해 게임을 검색하고 ID 내림차순으로 페이징한다.
        조건을 모두 생략하면 전체를 대상으로 한다.
      operationId: searchGames
      parameters:
        - name: status
          in: query
          required: false
          description: 이 상태인 게임만 포함
          schema:
            type: string
            enum: [PLAYING, CLEARED, FAILED]
            x-enumDescriptions:
              PLAYING: 진행 중
              CLEARED: 10층까지 클리어
              FAILED: 도중에 실패
        - name: minFloor
          in: query
          required: false
          description: 이 층 이상(`currentFloor >= minFloor`)인 게임만 포함
          schema:
            type: integer
            minimum: 1
            maximum: 10
        - name: keyword
          in: query
          required: false
          description: 플레이어 이름 부분 일치(대소문자 무시)
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 페이징된 게임 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePageResponse'
              example:
                content:
                  - id: 12
                    playerName: 밤의 후계자
                    currentFloor: 4
                    currentHp: 61
                    phase: BATTLE
                    status: PLAYING
                    deckSize: 12
                    createdAt: '2026-09-03T18:20:11'
                    updatedAt: '2026-09-03T19:02:45'
                page: 0
                size: 3
                totalElements: 7
                totalPages: 3
                hasNext: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /games/stats:
    get:
      tags: [검색]
      summary: 전체 기록 집계
      description: |
        저장된 모든 게임의 집계를 반환한다. 게임이 없으면 모든 값이 0이다.
        `clearRate`는 끝난 게임(`CLEARED`+`FAILED`) 중 `CLEARED`의 비율을 반올림한
        백분율이다.
      operationId: getStats
      responses:
        '200':
          description: 기록 집계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatsResponse'
              example:
                totalGames: 5
                playingGames: 3
                clearedGames: 1
                failedGames: 1
                highestFloor: 10
                clearRate: 50

components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      description: 게임의 고유 식별자
      schema:
        type: integer
        format: int64
        example: 12

  responses:
    BadRequest:
      description: 요청 본문 형식, enum 값 또는 필드 제약 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: Bad Request
            message: 'playerName 값이 올바르지 않습니다: 크기가 2에서 12 사이여야 합니다'
            path: /games
    NotFound:
      description: 해당 ID의 게임이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error: Not Found
            message: 게임을 찾을 수 없습니다. id=999
            path: /games/999

  examples:
    GameDetailCreated:
      value:
        id: 12
        playerName: 밤의 후계자
        currentHp: 99
        currentFloor: 1
        phase: REWARD
        status: PLAYING
        deck:
          - { id: 31, cardType: STRIKE, acquiredFloor: 0 }
          - { id: 32, cardType: STRIKE, acquiredFloor: 0 }
          - { id: 33, cardType: HEART_PIERCE, acquiredFloor: 0 }
          - { id: 34, cardType: GUARD, acquiredFloor: 0 }
          - { id: 35, cardType: MIST_KNOT, acquiredFloor: 0 }
          - { id: 36, cardType: QUICK_SLASH, acquiredFloor: 0 }
          - { id: 37, cardType: WARDING_SLASH, acquiredFloor: 0 }
          - { id: 38, cardType: BLOOD_RUNE, acquiredFloor: 0 }
          - { id: 39, cardType: MEND, acquiredFloor: 0 }
    GameDetailProgress:
      value:
        id: 12
        playerName: 밤의 후계자
        currentHp: 47
        currentFloor: 5
        phase: REWARD
        status: PLAYING
        deck:
          - { id: 58, cardType: STRIKE, acquiredFloor: 0 }
          - { id: 59, cardType: HEART_PIERCE, acquiredFloor: 0 }
          - { id: 60, cardType: SHATTER_BOLT, acquiredFloor: 2 }

  schemas:
    RunCardRequest:
      title: 요청 카드
      type: object
      required: [cardType, acquiredFloor]
      properties:
        cardType:
          type: string
          description: |
            카드 타입. 서버는 저장만 하고 해석하지 않으며, 값의 목록은 게임 클라이언트가 정한다.
            현재 쓰이는 값은 [카드 타입](#section/카드-타입) 절에 있다. 공백만으로 된 값은 허용하지 않는다.
          minLength: 1
          example: STRIKE
        acquiredFloor:
          type: integer
          description: 카드를 얻은 층. 시작 덱은 0.
          minimum: 0
          maximum: 10
          example: 0

    CardResponse:
      title: 카드
      type: object
      required: [id, cardType, acquiredFloor]
      properties:
        id:
          type: integer
          format: int64
          description: 카드의 고유 식별자. 덱을 교체하면 새로 발급된다.
          example: 31
        cardType:
          type: string
          description: 카드 타입. 값의 목록은 [카드 타입](#section/카드-타입) 절에 있다.
          example: STRIKE
        acquiredFloor:
          type: integer
          description: 카드를 얻은 층. 시작 덱은 0.
          example: 0

    CreateRequest:
      title: 게임 생성 요청
      type: object
      required: [playerName, deck]
      properties:
        playerName:
          type: string
          description: 플레이어 이름. 공백만으로 된 값은 허용하지 않는다.
          minLength: 2
          maxLength: 12
          example: 밤의 후계자
        deck:
          type: array
          description: 시작 덱. 요청 순서대로 저장된다.
          minItems: 1
          items:
            $ref: '#/components/schemas/RunCardRequest'

    RenameRequest:
      title: 이름 변경 요청
      type: object
      required: [playerName]
      properties:
        playerName:
          type: string
          description: 새 플레이어 이름. 공백만으로 된 값은 허용하지 않는다.
          minLength: 2
          maxLength: 12
          example: 붉은 순례자

    ProgressRequest:
      title: 진행 저장 요청
      type: object
      required: [currentHp, currentFloor, phase, status, deck]
      properties:
        currentHp:
          type: integer
          description: 현재 HP. 최대 99.
          minimum: 0
          maximum: 99
          example: 47
        currentFloor:
          type: integer
          description: 현재 층. 1층에서 시작해 10층이 마지막이다.
          minimum: 1
          maximum: 10
          example: 5
        phase:
          type: string
          description: 게임이 멈춰 있는 단계
          enum: [BATTLE, REWARD, FINISHED]
          x-enumDescriptions:
            BATTLE: 전투 중. 다시 불러오면 해당 층의 전투가 이어진다.
            REWARD: 보상 카드를 고르는 중. 시작 직후와 각 전투 승리 뒤에 머문다.
            FINISHED: 여정이 끝났다. status가 CLEARED 또는 FAILED다.
        status:
          type: string
          description: 게임의 결과 상태
          enum: [PLAYING, CLEARED, FAILED]
          x-enumDescriptions:
            PLAYING: 진행 중. 이어서 플레이할 수 있다.
            CLEARED: 10층까지 모두 클리어했다.
            FAILED: 도중에 HP가 0이 되어 실패했다.
        deck:
          type: array
          description: 저장할 전체 덱. 기존 카드를 모두 대체한다.
          minItems: 1
          items:
            $ref: '#/components/schemas/RunCardRequest'

    GameSummaryResponse:
      title: 게임 요약
      type: object
      description: |
        덱을 제외한 게임 요약. `deckSize`, `createdAt`, `updatedAt`은 선택 필드이며,
        있으면 클라이언트가 카드 수와 저장 시각을 표시한다.
      required: [id, playerName, currentFloor, currentHp, phase, status]
      properties:
        id:
          type: integer
          format: int64
          description: 게임의 고유 식별자
          example: 12
        playerName:
          type: string
          description: 플레이어 이름
          example: 밤의 후계자
        currentFloor:
          type: integer
          description: 현재 층 (1~10)
          example: 4
        currentHp:
          type: integer
          description: 현재 HP (0~99)
          example: 61
        phase:
          type: string
          description: 게임이 멈춰 있는 단계
          enum: [BATTLE, REWARD, FINISHED]
          x-enumDescriptions:
            BATTLE: 전투 중. 다시 불러오면 해당 층의 전투가 이어진다.
            REWARD: 보상 카드를 고르는 중. 시작 직후와 각 전투 승리 뒤에 머문다.
            FINISHED: 여정이 끝났다. status가 CLEARED 또는 FAILED다.
        status:
          type: string
          description: 게임의 결과 상태
          enum: [PLAYING, CLEARED, FAILED]
          x-enumDescriptions:
            PLAYING: 진행 중. 이어서 플레이할 수 있다.
            CLEARED: 10층까지 모두 클리어했다.
            FAILED: 도중에 HP가 0이 되어 실패했다.
        deckSize:
          type: integer
          description: 저장된 덱의 카드 수
          example: 12
        createdAt:
          type: string
          description: 생성 시각. 서버 시간대 기준 ISO 8601 형식이며 시간대 표기는 없다.
          example: '2026-09-03T18:20:11'
        updatedAt:
          type: string
          description: 마지막 저장 시각. 형식은 `createdAt`과 같다.
          example: '2026-09-03T19:02:45'

    GameDetailResponse:
      title: 게임 상세
      allOf:
        - $ref: '#/components/schemas/GameSummaryResponse'
        - type: object
          required: [deck]
          properties:
            deck:
              type: array
              description: 카드 ID 오름차순 전체 덱
              items:
                $ref: '#/components/schemas/CardResponse'

    GamePageResponse:
      title: 검색 결과 페이지
      type: object
      description: ID 내림차순 페이징 응답
      required: [content, page, size, totalElements, totalPages, hasNext]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/GameSummaryResponse'
        page:
          type: integer
          description: 현재 페이지 번호 (0부터)
          example: 0
        size:
          type: integer
          description: 요청한 페이지 크기
          example: 3
        totalElements:
          type: integer
          format: int64
          description: 조건에 맞는 전체 게임 수
          example: 7
        totalPages:
          type: integer
          description: 전체 페이지 수
          example: 3
        hasNext:
          type: boolean
          description: 다음 페이지가 있는지
          example: true

    GameStatsResponse:
      title: 기록 집계
      type: object
      required: [totalGames, playingGames, clearedGames, failedGames, highestFloor, clearRate]
      properties:
        totalGames:
          type: integer
          format: int64
          description: 저장된 전체 게임 수
          example: 5
        playingGames:
          type: integer
          format: int64
          description: 진행 중(`PLAYING`)인 게임 수
          example: 3
        clearedGames:
          type: integer
          format: int64
          description: 클리어(`CLEARED`)한 게임 수
          example: 1
        failedGames:
          type: integer
          format: int64
          description: 실패(`FAILED`)한 게임 수
          example: 1
        highestFloor:
          type: integer
          description: 모든 게임 중 가장 높은 현재 층. 게임이 없으면 0.
          example: 10
        clearRate:
          type: integer
          description: 끝난 게임 중 클리어 비율(백분율, 반올림)
          example: 50

    ErrorResponse:
      title: 오류 응답
      type: object
      description: |
        오류 응답 형식이다. `message`는 사람이 읽을 수 있는 원인 설명이며, 있으면 게임
        클라이언트가 그대로 화면에 표시한다.
      required: [status, error, path]
      properties:
        status:
          type: integer
          description: HTTP 상태 코드
          example: 404
        error:
          type: string
          description: 상태 코드의 표준 문구
          example: Not Found
        path:
          type: string
          description: 요청한 경로
          example: /games/999
        message:
          type: string
          description: 사람이 읽을 수 있는 원인 설명. 게임 화면에 그대로 표시된다.
          example: 게임을 찾을 수 없습니다. id=999
