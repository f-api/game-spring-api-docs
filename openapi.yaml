openapi: 3.1.0
info:
  title: Crimson Citadel 저장 서버 API
  version: 1.0.0
  description: |
    붉은 달의 성채(Crimson Citadel) 게임의 체크포인트 저장 서버 API다.
    전투 계산, 적 배치, 보상과 층 전이는 게임 클라이언트가 담당하고,
    서버는 실행(`Game`)과 그 덱(`RunCard`)을 저장·조회하는 CRUD만 제공한다.

    ## 한눈에 보기

    | 메서드 | 경로 | 성공 | 하는 일 |
    | --- | --- | ---: | --- |
    | `POST` | `/games` | `201` | 실행과 시작 덱 생성 |
    | `GET` | `/games` | `200` | 실행 요약 목록 (ID 내림차순) |
    | `GET` | `/games/{gameId}` | `200` | 실행 상세와 전체 덱 |
    | `PATCH` | `/games/{gameId}` | `204` | 플레이어 이름 변경 |
    | `PUT` | `/games/{gameId}/progress` | `200` | 진행 필드와 전체 덱 저장 |
    | `DELETE` | `/games/{gameId}` | `204` | 실행과 덱 삭제 |
    | `GET` | `/games/search` | `200` | 조건 검색과 페이징 |
    | `GET` | `/games/stats` | `200` | 전체 기록 집계 |

    ## 공통 규칙

    - 기본 주소는 `http://localhost:8080`이며 모든 요청과 응답은 JSON이다.
    - 성공 응답 상태 코드는 명세의 값을 따르되, 클라이언트는 2xx면 성공으로 처리한다.
    - 요청 본문의 형식, enum 값 또는 검증 규칙이 맞지 않으면 `400 Bad Request`를 반환한다.
    - 존재하지 않는 게임 ID를 지정하면 `404 Not Found`를 반환한다.
    - 오류 응답 본문에 `message` 문자열이 있으면 클라이언트가 화면에 그대로 표시한다.
    - 카드 타입(`cardType`)은 서버가 해석하지 않는 문자열이다.

    ## 선택 필드

    `createdAt`, `updatedAt`(저장 시각)과 `deckSize`(카드 수)는 목록·상세 응답의
    선택 필드다. `GET /games/search`와 `GET /games/stats`는 선택 API로, 서버가
    `404`를 반환하면 클라이언트는 해당 기능(목록 페이징, 기록판)을 숨긴다.
    선택 필드가 있으면 클라이언트는 저장 시각과 카드 수를 표시한다.
servers:
  - url: http://localhost:8080
tags:
  - name: Game
    description: 실행(게임) 생성, 조회, 이름 변경, 진행 저장, 삭제
  - name: Search
    description: 조건 검색과 페이징

paths:
  /games:
    post:
      tags: [Game]
      summary: 게임 생성
      description: |
        플레이어 이름과 시작 덱으로 새 실행을 만든다. 덱은 요청 순서대로 저장된다.
        `currentHp=99`, `currentFloor=1`, `phase=REWARD`, `status=PLAYING`으로 초기화한다.
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
            example:
              playerName: 밤의 후계자
              deck:
                - { cardType: STRIKE, acquiredFloor: 0 }
                - { cardType: STRIKE, acquiredFloor: 0 }
                - { cardType: HEART_PIERCE, acquiredFloor: 0 }
                - { cardType: GUARD, acquiredFloor: 0 }
                - { cardType: GUARD, acquiredFloor: 0 }
                - { cardType: QUICK_SLASH, acquiredFloor: 0 }
                - { cardType: WARDING_SLASH, acquiredFloor: 0 }
                - { cardType: BLOOD_RUNE, acquiredFloor: 0 }
                - { cardType: MEND, acquiredFloor: 0 }
      responses:
        '201':
          description: 생성된 실행의 상세
          headers:
            Location:
              description: 생성된 실행의 경로 (`/games/{id}`). 선택 헤더로, 없어도 클라이언트는 동작한다.
              schema:
                type: string
                example: /games/12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
              example:
                $ref: '#/components/examples/GameDetailCreated/value'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Game]
      summary: 게임 목록 조회
      description: 저장된 모든 실행을 ID 내림차순으로 반환한다. 덱은 포함하지 않는다. 없으면 빈 배열이다.
      operationId: getGames
      responses:
        '200':
          description: 실행 요약 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameSummaryResponse'
              example:
                - id: 12
                  playerName: 밤의 후계자
                  currentFloor: 4
                  currentHp: 61
                  phase: BATTLE
                  status: PLAYING
                - id: 11
                  playerName: 붉은 순례자
                  currentFloor: 10
                  currentHp: 0
                  phase: FINISHED
                  status: FAILED

  /games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [Game]
      summary: 게임 상세 조회
      description: 실행 한 건과 전체 덱을 반환한다. 덱은 카드 ID 오름차순이다.
      operationId: getGame
      responses:
        '200':
          description: 실행 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
              example:
                $ref: '#/components/examples/GameDetailProgress/value'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Game]
      summary: 플레이어 이름 변경
      description: 선택한 실행의 `playerName`만 변경한다. 다른 필드는 바뀌지 않는다.
      operationId: renameGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
            example:
              playerName: 붉은 순례자
      responses:
        '204':
          description: 변경 완료. 본문 없음.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Game]
      summary: 게임 삭제
      description: 실행과 그에 속한 모든 카드를 삭제한다.
      operationId: deleteGame
      responses:
        '204':
          description: 삭제 완료. 본문 없음.
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/progress:
    parameters:
      - $ref: '#/components/parameters/GameId'
    put:
      tags: [Game]
      summary: 진행과 전체 덱 저장
      description: |
        HP, 층, 단계, 상태와 **전체 덱**을 저장한다. `deck`은 추가할 카드가 아니라
        저장할 덱 전체다.

        실행 필드 갱신과 덱 교체는 원자적으로 처리된다. 기존 카드는 모두 제거되고
        요청의 덱이 순서대로 저장되므로, 같은 본문을 반복해 보내도 카드 수가 늘지 않는다.
        카드 ID는 교체할 때 새로 발급되므로 클라이언트는 응답의 덱을 사용한다.
      operationId: updateProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
            example:
              currentHp: 47
              currentFloor: 5
              phase: REWARD
              status: PLAYING
              deck:
                - { cardType: STRIKE, acquiredFloor: 0 }
                - { cardType: HEART_PIERCE, acquiredFloor: 0 }
                - { cardType: SHATTER_BOLT, acquiredFloor: 2 }
      responses:
        '200':
          description: 교체된 카드 ID가 담긴 실행 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
              example:
                $ref: '#/components/examples/GameDetailProgress/value'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 이미 끝난(`CLEARED`/`FAILED`) 실행에는 진행을 저장할 수 없다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                error: Conflict
                message: 이미 끝난 여정은 진행을 저장할 수 없습니다. id=12
                path: /games/12/progress

  /games/search:
    get:
      tags: [Search]
      summary: 게임 조건 검색과 페이징
      description: |
        상태와 최소 층 조건으로 실행을 검색하고 ID 내림차순으로 페이징한다.
        조건을 생략하면 전체를 대상으로 한다.
      operationId: searchGames
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GameStatus'
        - name: minFloor
          in: query
          required: false
          description: 이 층 이상(`currentFloor >= minFloor`)인 실행만 포함
          schema:
            type: integer
            minimum: 1
            maximum: 10
        - name: keyword
          in: query
          required: false
          description: 플레이어 이름 부분 일치(대소문자 무시)
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 페이징된 실행 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePageResponse'
              example:
                content:
                  - id: 12
                    playerName: 밤의 후계자
                    currentFloor: 4
                    currentHp: 61
                    phase: BATTLE
                    status: PLAYING
                    createdAt: '2026-09-03T18:20:11'
                    updatedAt: '2026-09-03T19:02:45'
                page: 0
                size: 3
                totalElements: 7
                totalPages: 3
                hasNext: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /games/stats:
    get:
      tags: [Search]
      summary: 전체 기록 집계
      description: |
        저장된 모든 실행의 집계를 반환한다. 실행이 없으면 모든 값이 0이다.
        `clearRate`는 끝난 실행(`CLEARED`+`FAILED`) 중 `CLEARED`의 비율을 반올림한
        백분율이다.
      operationId: getStats
      responses:
        '200':
          description: 기록 집계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatsResponse'
              example:
                totalGames: 5
                playingGames: 3
                clearedGames: 1
                failedGames: 1
                highestFloor: 10
                clearRate: 50

components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      description: 실행의 고유 식별자
      schema:
        type: integer
        format: int64
        example: 12

  responses:
    BadRequest:
      description: 요청 본문 형식, enum 값 또는 검증 규칙 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: Bad Request
            message: 'playerName 값이 올바르지 않습니다: 크기가 2에서 12 사이여야 합니다'
            path: /games
    NotFound:
      description: 해당 ID의 실행이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error: Not Found
            message: 게임을 찾을 수 없습니다. id=999
            path: /games/999

  examples:
    GameDetailCreated:
      value:
        id: 12
        playerName: 밤의 후계자
        currentHp: 99
        currentFloor: 1
        phase: REWARD
        status: PLAYING
        deck:
          - { id: 31, cardType: STRIKE, acquiredFloor: 0 }
          - { id: 32, cardType: STRIKE, acquiredFloor: 0 }
          - { id: 33, cardType: HEART_PIERCE, acquiredFloor: 0 }
          - { id: 34, cardType: GUARD, acquiredFloor: 0 }
          - { id: 35, cardType: GUARD, acquiredFloor: 0 }
          - { id: 36, cardType: QUICK_SLASH, acquiredFloor: 0 }
          - { id: 37, cardType: WARDING_SLASH, acquiredFloor: 0 }
          - { id: 38, cardType: BLOOD_RUNE, acquiredFloor: 0 }
          - { id: 39, cardType: MEND, acquiredFloor: 0 }
    GameDetailProgress:
      value:
        id: 12
        playerName: 밤의 후계자
        currentHp: 47
        currentFloor: 5
        phase: REWARD
        status: PLAYING
        deck:
          - { id: 58, cardType: STRIKE, acquiredFloor: 0 }
          - { id: 59, cardType: HEART_PIERCE, acquiredFloor: 0 }
          - { id: 60, cardType: SHATTER_BOLT, acquiredFloor: 2 }

  schemas:
    GamePhase:
      type: string
      description: 실행이 멈춰 있는 단계
      enum: [BATTLE, REWARD, FINISHED]
    GameStatus:
      type: string
      description: 실행의 결과 상태
      enum: [PLAYING, CLEARED, FAILED]

    RunCardRequest:
      type: object
      required: [cardType, acquiredFloor]
      properties:
        cardType:
          type: string
          description: 카드 타입. 서버는 해석하지 않는다. 공백만으로 된 값은 허용하지 않는다.
          minLength: 1
          example: STRIKE
        acquiredFloor:
          type: integer
          description: 카드를 얻은 층. 시작 덱은 0.
          minimum: 0
          maximum: 10
          example: 0

    CardResponse:
      type: object
      required: [id, cardType, acquiredFloor]
      properties:
        id:
          type: integer
          format: int64
          example: 31
        cardType:
          type: string
          example: STRIKE
        acquiredFloor:
          type: integer
          example: 0

    CreateRequest:
      type: object
      required: [playerName, deck]
      properties:
        playerName:
          type: string
          description: 공백만으로 된 값은 허용하지 않는다.
          minLength: 2
          maxLength: 12
          example: 밤의 후계자
        deck:
          type: array
          description: 시작 덱. 요청 순서대로 저장된다.
          minItems: 1
          items:
            $ref: '#/components/schemas/RunCardRequest'

    RenameRequest:
      type: object
      required: [playerName]
      properties:
        playerName:
          type: string
          description: 공백만으로 된 값은 허용하지 않는다.
          minLength: 2
          maxLength: 12
          example: 붉은 순례자

    ProgressRequest:
      type: object
      required: [currentHp, currentFloor, phase, status, deck]
      properties:
        currentHp:
          type: integer
          minimum: 0
          maximum: 99
          example: 47
        currentFloor:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        phase:
          $ref: '#/components/schemas/GamePhase'
        status:
          $ref: '#/components/schemas/GameStatus'
        deck:
          type: array
          description: 저장할 전체 덱. 기존 카드를 모두 대체한다.
          minItems: 1
          items:
            $ref: '#/components/schemas/RunCardRequest'

    GameSummaryResponse:
      type: object
      description: 덱을 제외한 실행 요약
      required: [id, playerName, currentFloor, currentHp, phase, status]
      properties:
        id:
          type: integer
          format: int64
          example: 12
        playerName:
          type: string
          example: 밤의 후계자
        currentFloor:
          type: integer
          example: 4
        currentHp:
          type: integer
          example: 61
        phase:
          $ref: '#/components/schemas/GamePhase'
        status:
          $ref: '#/components/schemas/GameStatus'
        deckSize:
          type: integer
          description: 저장된 덱의 카드 수. 선택 필드이며 있으면 목록에 표시된다.
          example: 12
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
          example: '2026-09-03T18:20:11'
        updatedAt:
          type: string
          format: date-time
          description: 마지막 수정 시각
          example: '2026-09-03T19:02:45'

    GameDetailResponse:
      allOf:
        - $ref: '#/components/schemas/GameSummaryResponse'
        - type: object
          required: [deck]
          properties:
            deck:
              type: array
              description: 카드 ID 오름차순 전체 덱
              items:
                $ref: '#/components/schemas/CardResponse'

    GamePageResponse:
      type: object
      description: ID 내림차순 페이징 응답
      required: [content, page, size, totalElements, totalPages, hasNext]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/GameSummaryResponse'
        page:
          type: integer
          description: 현재 페이지 번호 (0부터)
          example: 0
        size:
          type: integer
          description: 요청한 페이지 크기
          example: 3
        totalElements:
          type: integer
          format: int64
          description: 조건에 맞는 전체 실행 수
          example: 7
        totalPages:
          type: integer
          example: 3
        hasNext:
          type: boolean
          example: true

    GameStatsResponse:
      type: object
      required: [totalGames, playingGames, clearedGames, failedGames, highestFloor, clearRate]
      properties:
        totalGames:
          type: integer
          format: int64
          example: 5
        playingGames:
          type: integer
          format: int64
          example: 3
        clearedGames:
          type: integer
          format: int64
          example: 1
        failedGames:
          type: integer
          format: int64
          example: 1
        highestFloor:
          type: integer
          description: 모든 실행 중 가장 높은 현재 층. 실행이 없으면 0.
          example: 10
        clearRate:
          type: integer
          description: 끝난 실행 중 클리어 비율(백분율, 반올림)
          example: 50

    ErrorResponse:
      type: object
      description: |
        오류 응답 형식이다. `message`는 사람이 읽을 수 있는 원인 설명이며, 있으면 게임
        클라이언트가 그대로 화면에 표시한다.
      required: [status, error, path]
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        path:
          type: string
          example: /games/999
        message:
          type: string
          example: 게임을 찾을 수 없습니다.
