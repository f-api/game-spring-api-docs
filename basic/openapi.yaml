openapi: 3.1.0
info:
  title: Crimson Citadel 저장 서버 API
  version: 1.0.0
  description: |
    붉은 달의 성채(Crimson Citadel) 게임의 체크포인트 저장 서버 API다.
    전투 계산, 적 배치, 보상과 층 전이는 게임 클라이언트가 담당하고,
    서버는 게임과 그 덱을 저장·조회하는 CRUD만 제공한다.

    ## 한눈에 보기

    | 메서드 | 경로 | 성공 | 하는 일 |
    | --- | --- | ---: | --- |
    | `POST` | [`/games`](#tag/게임/operation/createGame) | `201` | 게임과 시작 덱 생성 |
    | `GET` | [`/games`](#tag/게임/operation/getGames) | `200` | 게임 요약 목록 (ID 내림차순) |
    | `GET` | [`/games/{gameId}`](#tag/게임/operation/getGame) | `200` | 게임 상세와 전체 덱 |
    | `PATCH` | [`/games/{gameId}`](#tag/게임/operation/renameGame) | `204` | 플레이어 이름 변경 |
    | `PUT` | [`/games/{gameId}/progress`](#tag/게임/operation/updateProgress) | `200` | 진행 필드와 전체 덱 저장 |
    | `DELETE` | [`/games/{gameId}`](#tag/게임/operation/deleteGame) | `204` | 게임과 덱 삭제 |
    | `GET` | [`/rankings`](#tag/랭킹/operation/getRankings) | `200` | 검증을 통과한 클리어 기록의 순위 |

    ## 오류 응답

    실패한 요청은 상태 코드와 함께 아래 형식의 본문을 돌려준다. `message`는 사람이 읽을 수 있는
    원인 설명이며, 게임 클라이언트는 이 문자열을 화면에 그대로 표시한다.

    | 상태 | 언제 |
    | ---: | --- |
    | `400` | 요청 본문 형식, enum 값, 필드 제약 위반. 경로·쿼리 파라미터에 숫자가 아닌 값을 보낸 경우도 포함 |
    | `404` | 존재하지 않는 게임 ID |
    | `409` | 이미 끝난 게임에 대한 진행 저장 |

    <SchemaDefinition schemaRef="#/components/schemas/ErrorResponse" />

    ## 선택 기능

    `GET /rankings`는 없어도 되는 API다. 서버가 `404`를 반환하면 클라이언트는 홈 화면의 랭킹 판을
    숨긴다. 응답이 있지만 이 명세와 다르면(필드·타입이 다르거나 순위 결과가 틀리면) 클라이언트는
    오류 창을 띄우고 게임을 시작하지 않는다.

    ## 랭킹 원본 데이터

    랭킹의 원본은 서버 DB가 아니라 아래 주소에 공개된 JSON 파일이다. 서버는 이 파일을 HTTP로 받아
    [`GET /rankings`](#tag/랭킹/operation/getRankings)의 규칙대로 검증·정렬한 결과를 돌려준다.

    ```
    https://f-api.github.io/game-spring-api-docs/basic/rankings.json
    ```

    파일은 한 시즌의 제출 기록 전체를 제출 시각 순서로 담는다. 각 기록은 플레이어, 결과, 최종 보스전,
    덱으로 이루어지며, 10층을 클리어하지 못한 기록은 `bossFight`가 `null`이다.

    <SchemaDefinition schemaRef="#/components/schemas/RankingSource" />

    <details class="card-types">
    <summary>기록 예시 펼치기</summary>

    ```json
    {
      "id": 5827,
      "player": { "name": "재서기", "region": "JP" },
      "result": { "clearedFloor": 10, "clearTimeSeconds": 300, "remainingHp": 12 },
      "bossFight": {
        "phases": [
          { "phase": "THRONE", "turns": 3, "damageTaken": 9 },
          { "phase": "UNBOUND", "turns": 4, "damageTaken": 21 },
          { "phase": "ECLIPSE", "turns": 6, "damageTaken": 9 }
        ],
        "finishingCard": "SUNDER"
      },
      "submittedAt": "2026-08-01T00:38:00Z",
      "deck": [
        { "cardType": "STRIKE", "acquiredFloor": 0 },
        { "cardType": "STRIKE", "acquiredFloor": 0 },
        { "cardType": "HEART_PIERCE", "acquiredFloor": 0 },
        { "cardType": "GUARD", "acquiredFloor": 0 },
        { "cardType": "MIST_KNOT", "acquiredFloor": 0 },
        { "cardType": "QUICK_SLASH", "acquiredFloor": 0 },
        { "cardType": "WARDING_SLASH", "acquiredFloor": 0 },
        { "cardType": "BLOOD_RUNE", "acquiredFloor": 0 },
        { "cardType": "MEND", "acquiredFloor": 0 },
        { "cardType": "SUNDER", "acquiredFloor": 1 },
        { "cardType": "SHATTER_BOLT", "acquiredFloor": 2 }
      ]
    }
    ```
    </details>

    ## 카드 타입

    `cardType`에 들어가는 값이다. 서버는 문자열로 저장만 하고, 카드의 효과와 표시 이름은 게임
    클라이언트가 정한다. 시작 덱은 `STRIKE` 2장, `HEART_PIERCE`, `GUARD`, `MIST_KNOT`, `QUICK_SLASH`,
    `WARDING_SLASH`, `BLOOD_RUNE`, `MEND` 9장이다.

    <details class="card-types">
    <summary>카드 타입 전체 목록 (38종) 펼치기</summary>
