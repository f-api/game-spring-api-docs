servers:
  - url: http://localhost:8080
tags:
  - name: 게임
    description: 게임 생성, 조회, 이름 변경, 진행 저장, 삭제
  - name: 랭킹
    description: 공개된 클리어 기록을 검증해 순위로 제공

paths:
  /games:
    post:
      tags: [게임]
      summary: 게임 생성
      description: |
        플레이어 이름과 시작 덱으로 새 게임을 만든다. 덱은 요청 순서대로 저장된다.
        `currentHp=99`, `currentFloor=1`, `phase=REWARD`, `status=PLAYING`으로 초기화한다.
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
            example:
              playerName: 밤의 후계자
              deck:
                - { cardType: STRIKE, acquiredFloor: 0 }
                - { cardType: STRIKE, acquiredFloor: 0 }
                - { cardType: HEART_PIERCE, acquiredFloor: 0 }
                - { cardType: GUARD, acquiredFloor: 0 }
                - { cardType: MIST_KNOT, acquiredFloor: 0 }
                - { cardType: QUICK_SLASH, acquiredFloor: 0 }
                - { cardType: WARDING_SLASH, acquiredFloor: 0 }
                - { cardType: BLOOD_RUNE, acquiredFloor: 0 }
                - { cardType: MEND, acquiredFloor: 0 }
      responses:
        '201':
          description: 생성된 게임의 상세
          headers:
            Location:
              description: 생성된 게임의 경로 (`/games/{id}`). 선택 헤더로, 없어도 클라이언트는 동작한다.
              schema:
                type: string
                example: /games/12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
              example:
                $ref: '#/components/examples/GameDetailCreated/value'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [게임]
      summary: 게임 목록 조회
      description: 저장된 모든 게임을 ID 내림차순으로 반환한다. 덱은 포함하지 않는다. 없으면 빈 배열이다.
      operationId: getGames
      responses:
        '200':
          description: 게임 요약 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameSummaryResponse'
              example:
                - id: 12
                  playerName: 밤의 후계자
                  currentFloor: 4
                  currentHp: 61
                  phase: BATTLE
                  status: PLAYING
                  deckSize: 12
                  createdAt: '2026-09-03T18:20:11'
                  updatedAt: '2026-09-03T19:02:45'
                - id: 11
                  playerName: 붉은 순례자
                  currentFloor: 10
                  currentHp: 0
                  phase: FINISHED
                  status: FAILED
                  deckSize: 15
                  createdAt: '2026-09-02T21:10:03'
                  updatedAt: '2026-09-02T22:48:39'

  /games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [게임]
      summary: 게임 상세 조회
      description: 게임 한 건과 전체 덱을 반환한다. 덱은 카드 ID 오름차순이다.
      operationId: getGame
      responses:
        '200':
          description: 게임 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
              example:
                $ref: '#/components/examples/GameDetailProgress/value'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [게임]
      summary: 플레이어 이름 변경
      description: 선택한 게임의 `playerName`만 변경한다. 다른 필드는 바뀌지 않는다.
      operationId: renameGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
            example:
              playerName: 붉은 순례자
      responses:
        '204':
          description: 변경 완료. 본문 없음.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [게임]
      summary: 게임 삭제
      description: 게임과 그에 속한 모든 카드를 삭제한다.
      operationId: deleteGame
      responses:
        '204':
          description: 삭제 완료. 본문 없음.
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/progress:
    parameters:
      - $ref: '#/components/parameters/GameId'
    put:
      tags: [게임]
      summary: 진행과 전체 덱 저장
      description: |
        HP, 층, 단계, 상태와 **전체 덱**을 저장한다. `deck`은 추가할 카드가 아니라
        저장할 덱 전체다.

        게임 필드 갱신과 덱 교체는 원자적으로 처리된다. 기존 카드는 모두 제거되고
        요청의 덱이 순서대로 저장되므로, 같은 본문을 반복해 보내도 카드 수가 늘지 않는다.
        카드 ID는 교체할 때 새로 발급되므로 클라이언트는 응답의 덱을 사용한다.
      operationId: updateProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
            example:
              currentHp: 47
              currentFloor: 5
              phase: REWARD
              status: PLAYING
              deck:
                - { cardType: STRIKE, acquiredFloor: 0 }
                - { cardType: HEART_PIERCE, acquiredFloor: 0 }
                - { cardType: SHATTER_BOLT, acquiredFloor: 2 }
      responses:
        '200':
          description: 교체된 카드 ID가 담긴 게임 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailResponse'
              example:
                $ref: '#/components/examples/GameDetailProgress/value'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 이미 끝난(`CLEARED`/`FAILED`) 게임에는 진행을 저장할 수 없다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                error: Conflict
                message: 이미 끝난 여정은 진행을 저장할 수 없습니다. id=12
                path: /games/12/progress

  /rankings:
    get:
      tags: [랭킹]
      summary: 검증된 클리어 랭킹
      description: |
        [랭킹 원본 데이터](#section/랭킹-원본-데이터)를 받아 아래 순서로 처리한 결과를 돌려준다.

        **1. 순위 대상.** `result.clearedFloor`가 `10`인 기록만 순위 대상이다. 그 밖의 기록은
        순위에도, `excludedCount`에도 들어가지 않는다.

        **2. 정상 기록 조건.** 순위 대상 중 아래를 하나라도 어기는 기록은 이상 기록으로 보고 제외하며,
        제외한 수가 `excludedCount`다.

        | 항목 | 정상 기록의 조건 |
        | --- | --- |
        | 클리어 시간 | `clearTimeSeconds`가 층당 30초 이상, 즉 `clearedFloor × 30` 이상 |
        | 남은 HP | `remainingHp`가 1 이상 99 이하 |
        | 덱 크기 | `deck`이 9장 이상 20장 이하 |
        | 카드 타입 | 모든 `deck[].cardType`이 [카드 타입](#section/카드-타입) 목록에 있는 값 |
        | 획득 층 | 모든 `deck[].acquiredFloor`가 0 이상 9 이하 |
        | 보스 페이즈 | `bossFight.phases`가 `THRONE`, `UNBOUND`, `ECLIPSE` 순서로 정확히 3개이고, 각 `turns`가 1 이상 |
        | 마무리 카드 | `bossFight.finishingCard`가 그 기록의 `deck`에 있는 카드 타입 |

        **3. 정렬.** 정상 기록을 `clearTimeSeconds` 오름차순, 같으면 `remainingHp` 내림차순,
        그래도 같으면 `id` 오름차순으로 정렬한다.

        **4. 플레이어당 하나.** 같은 `player.name`의 정상 기록이 여러 개면 정렬 순서에서 앞선 하나만
        남긴다. 남은 기록에 1부터 순위를 매긴다.

        `bossTurns`는 세 페이즈 `turns`의 합, `deckSize`는 `deck`의 카드 수다.
      operationId: getRankings
      responses:
        '200':
          description: 검증·정렬된 랭킹
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'
              example:
                season: '2026-09'
                totalRecords: 198
                excludedCount: 30
                entries:
                  - rank: 1
                    playerName: 재서기
                    clearTimeSeconds: 300
                    remainingHp: 12
                    bossTurns: 13
                    deckSize: 11
                  - rank: 2
                    playerName: 안개칼날
                    clearTimeSeconds: 863
                    remainingHp: 74
                    bossTurns: 15
                    deckSize: 20

components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      description: 게임의 고유 식별자
      schema:
        type: integer
        format: int64
        example: 12

  responses:
    BadRequest:
      description: 요청 본문 형식, enum 값 또는 필드 제약 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: Bad Request
            message: 'playerName 값이 올바르지 않습니다: 크기가 2에서 12 사이여야 합니다'
            path: /games
    NotFound:
      description: 해당 ID의 게임이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error: Not Found
            message: 게임을 찾을 수 없습니다. id=999
            path: /games/999

  examples:
    GameDetailCreated:
      value:
        id: 12
        playerName: 밤의 후계자
        currentHp: 99
        currentFloor: 1
        phase: REWARD
        status: PLAYING
        createdAt: '2026-09-03T18:20:11'
        updatedAt: '2026-09-03T18:20:11'
        deck:
          - { id: 31, cardType: STRIKE, acquiredFloor: 0 }
          - { id: 32, cardType: STRIKE, acquiredFloor: 0 }
          - { id: 33, cardType: HEART_PIERCE, acquiredFloor: 0 }
          - { id: 34, cardType: GUARD, acquiredFloor: 0 }
          - { id: 35, cardType: MIST_KNOT, acquiredFloor: 0 }
          - { id: 36, cardType: QUICK_SLASH, acquiredFloor: 0 }
          - { id: 37, cardType: WARDING_SLASH, acquiredFloor: 0 }
          - { id: 38, cardType: BLOOD_RUNE, acquiredFloor: 0 }
          - { id: 39, cardType: MEND, acquiredFloor: 0 }
    GameDetailProgress:
      value:
        id: 12
        playerName: 밤의 후계자
        currentHp: 47
        currentFloor: 5
        phase: REWARD
        status: PLAYING
        createdAt: '2026-09-03T18:20:11'
        updatedAt: '2026-09-03T19:02:45'
        deck:
          - { id: 58, cardType: STRIKE, acquiredFloor: 0 }
          - { id: 59, cardType: HEART_PIERCE, acquiredFloor: 0 }
          - { id: 60, cardType: SHATTER_BOLT, acquiredFloor: 2 }

  schemas:
    RunCardRequest:
      title: 요청 카드
      type: object
      required: [cardType, acquiredFloor]
      properties:
        cardType:
          type: string
          description: |
            카드 타입. 서버는 저장만 하고 해석하지 않으며, 값의 목록은 게임 클라이언트가 정한다.
            현재 쓰이는 값은 [카드 타입](#section/카드-타입) 절에 있다. 공백만으로 된 값은 허용하지 않는다.
          minLength: 1
          example: STRIKE
        acquiredFloor:
          type: integer
          description: 카드를 얻은 층. 시작 덱은 0.
          minimum: 0
          maximum: 10
          example: 0

    CardResponse:
      title: 카드
      type: object
      required: [id, cardType, acquiredFloor]
      properties:
        id:
          type: integer
          format: int64
          description: 카드의 고유 식별자. 덱을 교체하면 새로 발급된다.
          example: 31
        cardType:
          type: string
          description: 카드 타입. 값의 목록은 [카드 타입](#section/카드-타입) 절에 있다.
          example: STRIKE
        acquiredFloor:
          type: integer
          description: 카드를 얻은 층. 시작 덱은 0.
          example: 0

    CreateRequest:
      title: 게임 생성 요청
      type: object
      required: [playerName, deck]
      properties:
        playerName:
          type: string
          description: 플레이어 이름. 공백만으로 된 값은 허용하지 않는다.
          minLength: 2
          maxLength: 12
          example: 밤의 후계자
        deck:
          type: array
          description: 시작 덱. 요청 순서대로 저장된다.
          minItems: 1
          items:
            $ref: '#/components/schemas/RunCardRequest'

    RenameRequest:
      title: 이름 변경 요청
      type: object
      required: [playerName]
      properties:
        playerName:
          type: string
          description: 새 플레이어 이름. 공백만으로 된 값은 허용하지 않는다.
          minLength: 2
          maxLength: 12
          example: 붉은 순례자

    ProgressRequest:
      title: 진행 저장 요청
      type: object
      required: [currentHp, currentFloor, phase, status, deck]
      properties:
        currentHp:
          type: integer
          description: 현재 HP. 최대 99.
          minimum: 0
          maximum: 99
          example: 47
        currentFloor:
          type: integer
          description: 현재 층. 1층에서 시작해 10층이 마지막이다.
          minimum: 1
          maximum: 10
          example: 5
        phase:
          type: string
          description: 게임이 멈춰 있는 단계
          enum: [BATTLE, REWARD, FINISHED]
          x-enumDescriptions:
            BATTLE: 전투 중. 다시 불러오면 해당 층의 전투가 이어진다.
            REWARD: 보상 카드를 고르는 중. 시작 직후와 각 전투 승리 뒤에 머문다.
            FINISHED: 여정이 끝났다. status가 CLEARED 또는 FAILED다.
        status:
          type: string
          description: 게임의 결과 상태
          enum: [PLAYING, CLEARED, FAILED]
          x-enumDescriptions:
            PLAYING: 진행 중. 이어서 플레이할 수 있다.
            CLEARED: 10층까지 모두 클리어했다.
            FAILED: 도중에 HP가 0이 되어 실패했다.
        deck:
          type: array
          description: 저장할 전체 덱. 기존 카드를 모두 대체한다.
          minItems: 1
          items:
            $ref: '#/components/schemas/RunCardRequest'

    GameSummaryResponse:
      title: 게임 요약
      type: object
      description: |
        덱을 제외한 게임 요약. `deckSize`, `createdAt`, `updatedAt`은 선택 필드이며,
        있으면 클라이언트가 카드 수와 저장 시각을 표시한다.
      required: [id, playerName, currentFloor, currentHp, phase, status]
      properties:
        id:
          type: integer
          format: int64
          description: 게임의 고유 식별자
          example: 12
        playerName:
          type: string
          description: 플레이어 이름
          example: 밤의 후계자
        currentFloor:
          type: integer
          description: 현재 층 (1~10)
          example: 4
        currentHp:
          type: integer
          description: 현재 HP (0~99)
          example: 61
        phase:
          type: string
          description: 게임이 멈춰 있는 단계
          enum: [BATTLE, REWARD, FINISHED]
          x-enumDescriptions:
            BATTLE: 전투 중. 다시 불러오면 해당 층의 전투가 이어진다.
            REWARD: 보상 카드를 고르는 중. 시작 직후와 각 전투 승리 뒤에 머문다.
            FINISHED: 여정이 끝났다. status가 CLEARED 또는 FAILED다.
        status:
          type: string
          description: 게임의 결과 상태
          enum: [PLAYING, CLEARED, FAILED]
          x-enumDescriptions:
            PLAYING: 진행 중. 이어서 플레이할 수 있다.
            CLEARED: 10층까지 모두 클리어했다.
            FAILED: 도중에 HP가 0이 되어 실패했다.
        deckSize:
          type: integer
          description: 저장된 덱의 카드 수. 목록 응답에만 있고 상세 응답에는 없다(덱 자체가 있으므로)
          example: 12
        createdAt:
          type: string
          description: 생성 시각. 서버 시간대 기준 ISO 8601 형식이며 시간대 표기는 없다. 소수점 초가 붙을 수 있다.
          example: '2026-09-03T18:20:11'
        updatedAt:
          type: string
          description: 마지막 저장 시각. 형식은 `createdAt`과 같다.
          example: '2026-09-03T19:02:45'

    GameDetailResponse:
      title: 게임 상세
      allOf:
        - $ref: '#/components/schemas/GameSummaryResponse'
        - type: object
          required: [deck]
          properties:
            deck:
              type: array
              description: 카드 ID 오름차순 전체 덱
              items:
                $ref: '#/components/schemas/CardResponse'

    RankingResponse:
      title: 랭킹 응답
      type: object
      required: [season, totalRecords, excludedCount, entries]
      properties:
        season:
          type: string
          description: 원본 데이터의 `season` 그대로
          example: '2026-09'
        totalRecords:
          type: integer
          description: 원본 데이터의 전체 기록 수 (`records` 길이)
          example: 198
        excludedCount:
          type: integer
          description: 순위 대상 중 정상 기록 조건에 어긋나 제외한 기록 수
          example: 30
        entries:
          type: array
          description: 순위 오름차순 목록
          items:
            $ref: '#/components/schemas/RankingEntryResponse'

    RankingEntryResponse:
      title: 랭킹 항목
      type: object
      required: [rank, playerName, clearTimeSeconds, remainingHp, bossTurns, deckSize]
      properties:
        rank:
          type: integer
          description: 1부터 시작하는 순위
          example: 1
        playerName:
          type: string
          description: 원본의 `player.name`
          example: 재서기
        clearTimeSeconds:
          type: integer
          description: 클리어까지 걸린 시간(초)
          example: 300
        remainingHp:
          type: integer
          description: 클리어 시점의 남은 HP
          example: 12
        bossTurns:
          type: integer
          description: 최종 보스전 세 페이즈 `turns`의 합
          example: 13
        deckSize:
          type: integer
          description: 클리어 시점의 덱 카드 수
          example: 11

    RankingSource:
      title: 랭킹 원본 파일
      type: object
      required: [season, records]
      properties:
        season:
          type: string
          description: 시즌 식별자
          example: '2026-09'
        records:
          type: array
          description: 제출 시각 순서의 기록 전체
          items:
            $ref: '#/components/schemas/RankingRecord'

    RankingRecord:
      title: 제출 기록
      type: object
      required: [id, player, result, bossFight, submittedAt, deck]
      properties:
        id:
          type: integer
          format: int64
          description: 기록 ID. 파일 안에서 고유하다
          example: 5827
        player:
          $ref: '#/components/schemas/RankingPlayer'
        result:
          $ref: '#/components/schemas/RankingResult'
        bossFight:
          description: 최종 보스전 기록. 10층을 클리어하지 못한 기록은 `null`
          oneOf:
            - $ref: '#/components/schemas/RankingBossFight'
            - type: 'null'
        submittedAt:
          type: string
          format: date-time
          description: 제출 시각(UTC)
          example: '2026-08-01T00:38:00Z'
        deck:
          type: array
          description: 게임이 끝난 시점의 덱. 시작 덱 9장은 `acquiredFloor`가 0이다
          items:
            $ref: '#/components/schemas/RankingCard'

    RankingPlayer:
      title: 제출 플레이어
      type: object
      required: [name, region]
      properties:
        name:
          type: string
          description: 플레이어 이름. 한 플레이어가 여러 기록을 제출할 수 있다
          example: 재서기
        region:
          type: string
          description: 지역 코드
          example: JP

    RankingResult:
      title: 게임 결과
      type: object
      required: [clearedFloor, clearTimeSeconds, remainingHp]
      properties:
        clearedFloor:
          type: integer
          description: 클리어한 마지막 층. 10이면 성채를 정복한 것이다
          example: 10
        clearTimeSeconds:
          type: integer
          description: 게임 시작부터 끝까지 걸린 시간(초)
          example: 300
        remainingHp:
          type: integer
          description: 게임이 끝난 시점의 HP. 클리어하지 못한 기록은 0이다
          example: 12

    RankingBossFight:
      title: 최종 보스전
      type: object
      required: [phases, finishingCard]
      properties:
        phases:
          type: array
          description: 페이즈별 기록. 정상 기록은 `THRONE`, `UNBOUND`, `ECLIPSE` 순서로 3개다
          items:
            $ref: '#/components/schemas/RankingBossPhase'
        finishingCard:
          type: string
          description: 보스를 쓰러뜨린 카드의 카드 타입
          example: SUNDER

    RankingBossPhase:
      title: 보스 페이즈 기록
      type: object
      required: [phase, turns, damageTaken]
      properties:
        phase:
          type: string
          description: 페이즈 이름
          enum: [THRONE, UNBOUND, ECLIPSE]
          x-enumDescriptions:
            THRONE: 피눈물의 신사
            UNBOUND: 찢어진 연회
            ECLIPSE: 태어나지 못한 왕
        turns:
          type: integer
          description: 이 페이즈에서 쓴 턴 수
          example: 3
        damageTaken:
          type: integer
          description: 이 페이즈에서 받은 피해량
          example: 9

    RankingCard:
      title: 기록의 카드
      type: object
      required: [cardType, acquiredFloor]
      properties:
        cardType:
          type: string
          description: 카드 타입 값
          example: SUNDER
        acquiredFloor:
          type: integer
          description: 카드를 얻은 층. 시작 덱은 0
          example: 1

    ErrorResponse:
      title: 오류 응답
      type: object
      description: |
        오류 응답 형식이다. `message`는 사람이 읽을 수 있는 원인 설명이며, 있으면 게임
        클라이언트가 그대로 화면에 표시한다.
      required: [status, error, path]
      properties:
        status:
          type: integer
          description: HTTP 상태 코드
          example: 404
        error:
          type: string
          description: 상태 코드의 표준 문구
          example: Not Found
        path:
          type: string
          description: 요청한 경로
          example: /games/999
        message:
          type: string
          description: 사람이 읽을 수 있는 원인 설명. 게임 화면에 그대로 표시된다.
          example: 게임을 찾을 수 없습니다. id=999
