<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebCraft API</title>
  <style>
    :root {
      --ivory: #fdf9f3;
      --blossom: #faeadb;
      --blossom-deep: #f1cfae;
      --rose: #c9683a;
      --rose-deep: #a84f2a;
      --sage: #e4e6c8;
      --sage-deep: #7d8f4a;
      --butter: #f5dfa0;
      --butter-deep: #c9962b;
      --sky: #e6d9c8;
      --sky-deep: #8a6b4d;
      --lilac: #eacfc0;
      --lilac-deep: #a86a5c;
      --ink: #3f3229;
      --ink-soft: #8a7a6c;
      --line: #efdcc7;
      --panel: #f5f1e8;
      --code-bg: #efe9dc;
    }
    html, body { margin: 0; background: var(--ivory); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, "Segoe UI", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 사이드 메뉴 ───────────────────────────── */
    .menu-content {
      background: linear-gradient(180deg, #faeadb 0%, #fdf3e6 100%) !important;
      border-right: 1px solid var(--line);
    }
    .menu-content a[href*="redocly.com"] { display: none !important; }
    .menu-content [role="search"] { padding: 14px 16px 10px !important; }
    .menu-content [role="search"] svg { left: 28px !important; top: 24px !important; width: 14px !important; height: 16px !important; }
    .menu-content [role="search"] .search-input {
      width: calc(100% - 0px) !important; margin: 0 !important; box-sizing: border-box;
      padding: 9px 12px 9px 34px !important;
      background: #fff !important; color: var(--ink) !important;
      border: 1px solid var(--blossom-deep) !important; border-radius: 12px !important;
      font-size: 14px !important;
    }
    .menu-content [role="search"] .search-input:focus { outline: none; border-color: var(--rose) !important; box-shadow: 0 0 0 3px #f6e1cc; }
    .menu-content [role="search"] .search-input::placeholder { color: #b3a293; }
    .menu-content label { color: var(--ink) !important; font-weight: 500; margin: 2px 10px !important; border-radius: 10px; }
    .menu-content li > label:hover { background: #f6e1cc !important; }
    .menu-content li > label.active { background: #fff !important; color: var(--rose-deep) !important; box-shadow: 0 1px 2px rgba(168,79,42,.15); }
    .menu-content label > span[type] { border-radius: 6px !important; font-weight: 700 !important; }
    .menu-content ul ul label { font-weight: 400; }
    .menu-content > div:last-child { border-top: 1px solid var(--line); background: transparent !important; }
    .menu-content > div:last-child a { color: var(--ink-soft) !important; }

    /* ── 본문 ─────────────────────────────────── */
    .api-content h1 { color: var(--ink) !important; font-size: 30px !important; letter-spacing: -0.01em; }
    /* 절·태그 제목(2단계)과 개별 API 제목(3단계)의 크기를 구분 */
    .api-content h2 { color: var(--ink) !important; font-size: 26px !important; letter-spacing: -0.01em; }
    .api-content h2::before {
      content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 10px;
      border-radius: 50%; background: var(--rose); vertical-align: 3px;
    }
    .api-content [data-section-id*="/operation/"] h2 { font-size: 19px !important; letter-spacing: 0; }
    .api-content [data-section-id*="/operation/"] h2::before { width: 7px; height: 7px; margin-right: 8px; vertical-align: 2px; background: var(--blossom-deep); }
    .api-content h3 { color: var(--ink-soft) !important; font-size: 13px !important; letter-spacing: .06em; }
    /* 웹소켓 메시지 제목 */
    .api-content [data-section-id="section/클라이언트가-보내는-메시지"] h3, .api-content [data-section-id="section/서버가-보내는-메시지"] h3 { color: var(--ink) !important; font-size: 17px !important; letter-spacing: 0; margin-top: 30px; font-family: "SF Mono", Menlo, Consolas, monospace; }
    .api-content p, .api-content li, .api-content td { line-height: 1.8 !important; color: var(--ink); }
    /* 마크다운 표만 스타일링 (스키마 표는 Redoc 기본 유지) */
    /* 접히는 목록(카드 타입) */
    .api-content details.card-types { border: 1px solid var(--line); border-radius: 12px; background: #fff; margin: 12px 0 0; }
    .api-content details.card-types > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; color: var(--rose); list-style: none; }
    .api-content details.card-types > summary::-webkit-details-marker { display: none; }
    .api-content details.card-types > summary::before { content: "▸"; display: inline-block; margin-right: 8px; transition: transform .15s; }
    .api-content details.card-types[open] > summary::before { transform: rotate(90deg); }
    .api-content details.card-types > table { margin: 0 14px 14px; }
    .api-content details.card-types td, .api-content details.card-types th { padding: 6px 14px; border-bottom: 1px solid var(--line); text-align: left; }
    .api-content details.card-types th { background: var(--blossom); }
    .api-content .redoc-markdown table { display: table !important; width: auto !important; border-collapse: separate !important; border-spacing: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .api-content .redoc-markdown table th { background: var(--blossom) !important; color: var(--ink) !important; border: none !important; border-bottom: 1px solid var(--line) !important; font-weight: 600; }
    .api-content .redoc-markdown table td { border: none !important; border-bottom: 1px solid var(--line) !important; }
    .api-content .redoc-markdown table td code { white-space: nowrap; }
    .api-content .redoc-markdown table tr:last-child td { border-bottom: none !important; }
    .api-content .redoc-markdown table tr:nth-child(even) td { background: #fcf6ee; }
    .api-content code, .menu-content code {
      background: #fbeee2 !important; color: var(--rose-deep) !important;
      border: 1px solid #efd3b8 !important; border-radius: 6px !important; padding: 1px 6px !important;
      font-size: 12.5px !important;
    }
    /* 필드명(왼쪽 컬럼) 배경 */
    .api-content .redoc-markdown table td:first-child code { background: #fff !important; }

    /* 엔드포인트 경로 바 */
    .api-content [class*="Endpoint"] > button, .api-content button[class*="EndpointBtn"] {
      background: #fff !important; border: 1px solid var(--line) !important; border-radius: 12px !important;
      box-shadow: 0 1px 3px rgba(63,50,41,.06) !important;
    }
    .http-verb { border-radius: 8px !important; font-weight: 700 !important; letter-spacing: .02em; }
    .http-verb.get    { background: var(--sage-deep) !important; }
    .http-verb.post   { background: var(--sky-deep) !important; }
    .http-verb.put    { background: var(--butter-deep) !important; }
    .http-verb.patch  { background: var(--lilac-deep) !important; }
    .http-verb.delete { background: var(--rose-deep) !important; }

    /* 응답 코드 행 */
    .api-content button[class*="ResponseTitle"] { border-radius: 12px !important; margin-bottom: 6px !important; }

    /* ── 우측 패널 (라이트) ─────────────────────── */
    .redoc-wrap [class*="RightPanel"], .redoc-wrap [class*="right-panel"] { background: var(--panel) !important; }
    .redoc-wrap [class*="RightPanel"] h3, .redoc-wrap [class*="right-panel"] h3 { color: var(--ink) !important; }
    /* 샘플 도구 버튼(Copy · Expand all · Collapse all)을 버튼답게 */
    .redoc-wrap div:has(> button + button) { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 8px; }
    .redoc-wrap div > button:has(+ button), .redoc-wrap div > button + button {
      appearance: none; cursor: pointer; padding: 4px 12px !important; border-radius: 999px !important;
      border: 1px solid var(--blossom-deep) !important; background: #fff !important; color: var(--rose) !important;
      font-size: 12px !important; font-weight: 600 !important; line-height: 1.6 !important; margin: 0 !important;
      transition: background .15s, color .15s;
    }
    .redoc-wrap div > button:has(+ button):hover, .redoc-wrap div > button + button:hover { background: var(--rose) !important; color: #fff !important; border-color: var(--rose) !important; }
    .redoc-wrap div > button:has(+ button) > div, .redoc-wrap div > button + button > div { display: inline; color: inherit !important; font-size: inherit !important; }
    .react-tabs__tab-list { border-bottom: 1px solid #e6dccb !important; }
    .react-tabs__tab {
      background: #fff !important; color: var(--ink-soft) !important; border: 1px solid #e8dfcf !important;
      border-bottom: none !important; border-radius: 10px 10px 0 0 !important;
    }
    .react-tabs__tab--selected { background: var(--rose) !important; color: #fff !important; border-color: var(--rose) !important; }
    .react-tabs__tab-panel > div { background: var(--code-bg) !important; border-radius: 12px !important; }
    /* 코드 샘플 토큰 */
    .redoc-wrap pre { color: var(--ink) !important; }
    .redoc-wrap .token.string { color: #6c7f3a !important; }
    .redoc-wrap .token.number, .redoc-wrap .token.boolean { color: #8a5a3c !important; }
    .redoc-wrap .token.property, .redoc-wrap .token.punctuation { color: var(--ink) !important; }
    .redoc-wrap [class*="right-panel"] div[class*="ExampleValue"], .redoc-wrap [class*="right-panel"] [class*="samples"] { color: var(--ink) !important; }
    .redoc-wrap [class*="right-panel"] select, .redoc-wrap [class*="right-panel"] label { color: var(--ink) !important; }
  </style>
</head>
<body>
  <redoc
    spec-url="./openapi.yaml"
    hide-download-button
    expand-responses="200,201"
    required-props-first
    path-in-middle-panel
    json-sample-expand-level="2"
    schema-expansion-level="all"
    theme='{
      "colors": {
        "primary": { "main": "#c9683a" },
        "success": { "main": "#7d8f4a" },
        "warning": { "main": "#c9962b" },
        "error": { "main": "#c25a3c" },
        "text": { "primary": "#3f3229", "secondary": "#8a7a6c" },
        "border": { "dark": "#efdcc7", "light": "#f8efe4" },
        "responses": {
          "success": { "color": "#6c7f3a", "backgroundColor": "#eef0e0", "tabTextColor": "#6c7f3a" },
          "error": { "color": "#a84f2a", "backgroundColor": "#faeadb", "tabTextColor": "#a84f2a" },
          "redirect": { "color": "#a07a2a", "backgroundColor": "#fbf3df" },
          "info": { "color": "#8a6b4d", "backgroundColor": "#f1e9de" }
        },
        "http": {
          "get": "#7d8f4a", "post": "#8a6b4d", "put": "#c9962b",
          "patch": "#a86a5c", "delete": "#a84f2a"
        }
      },
      "typography": {
        "fontSize": "15px",
        "lineHeight": "1.75",
        "fontFamily": "-apple-system, BlinkMacSystemFont, \"Apple SD Gothic Neo\", Pretendard, \"Segoe UI\", \"Noto Sans KR\", sans-serif",
        "headings": { "fontFamily": "inherit", "fontWeight": "700", "lineHeight": "1.4" },
        "code": { "fontSize": "13px", "fontFamily": "\"SF Mono\", Menlo, Consolas, monospace", "color": "#a84f2a", "backgroundColor": "#fbeee2" },
        "links": { "color": "#a84f2a", "visited": "#a84f2a", "hover": "#c9683a" }
      },
      "sidebar": {
        "backgroundColor": "#faeadb",
        "textColor": "#3f3229",
        "activeTextColor": "#a84f2a",
        "width": "280px",
        "groupItems": { "activeBackgroundColor": "#fff", "activeTextColor": "#a84f2a" },
        "level1Items": { "activeBackgroundColor": "#fff", "activeTextColor": "#a84f2a" }
      },
      "rightPanel": {
        "backgroundColor": "#f5f1e8",
        "textColor": "#3f3229",
        "width": "42%"
      },
      "codeBlock": { "backgroundColor": "#efe9dc" },
      "schema": {
        "nestedBackground": "#fbf4ea",
        "typeNameColor": "#8a6b4d",
        "typeTitleColor": "#8a6b4d",
        "requireLabelColor": "#a84f2a",
        "linesColor": "#efdcc7",
        "labelsTextSize": "0.85em"
      },
      "spacing": { "sectionVertical": 48, "sectionHorizontal": 40 }
    }'
  ></redoc>
  <script src="../redoc.standalone.js"></script>
</body>
</html>
