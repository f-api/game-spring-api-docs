        cause:
          type: string
          description: 변경 원인. 예를 들어 `fall`, `mob`, `starve`, `regen`
        hunger:
          type: integer
          description: 허기(0~20)
        saturationMilli:
          type: integer
          description: 포만감을 1000배한 정수
      example: { type: healthUpdate, health: 14, cause: fall, hunger: 18, saturationMilli: 4200 }

