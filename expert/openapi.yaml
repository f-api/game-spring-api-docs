    WsChatBroadcast:
      title: chat (방송)
      type: object
      required: [type, sender, content, timestamp]
      properties:
        type:
          type: string
          const: chat
          description: 메시지 종류
        sender:
          type: string
          description: 보낸 플레이어 닉네임
        content:
          type: string
          description: 내용
        timestamp:
          type: string
          description: 저장 시각. 서버 시간대 기준 ISO 8601, 시간대 표기 없음
      example: { type: chat, sender: steve, content: 여기 다이아 있어요!, timestamp: '2026-07-16T12:30:00' }

    WsBlockUpdate:
      title: blockUpdate
      type: object
      required: [type, blocks, chunkVersions]
      properties:
        type:
          type: string
          const: blockUpdate
          description: 메시지 종류
        blocks:
          type: array
          description: 바뀐 블록들
          items:
            type: object
            required: [x, y, z, blockType, state, revision]
            properties:
              x: { type: integer, format: int32, description: 블록 좌표 X }
              y: { type: integer, format: int32, description: 블록 좌표 Y }
              z: { type: integer, format: int32, description: 블록 좌표 Z }
              blockType: { type: integer, format: int32, description: 바뀐 뒤의 블록 ID. 0은 공기 }
              state: { type: integer, description: 블록 state 바이트 (0~255) }
              revision: { type: integer, format: int64, description: 이 블록이 속한 청크의 변경 번호 }
        chunkVersions:
          type: array
          description: 이번 갱신으로 바뀐 청크의 버전 범위
          items:
            type: object
            required: [cx, cz, fromVersion, toVersion]
            properties:
              cx: { type: integer, format: int32, description: 청크 X }
              cz: { type: integer, format: int32, description: 청크 Z }
              fromVersion: { type: integer, format: int64, description: 갱신 전 버전 }
              toVersion: { type: integer, format: int64, description: 갱신 후 버전 }
      example:
        type: blockUpdate
        blocks: [{ x: 10, y: 64, z: 5, blockType: 81, state: 2, revision: 132 }]
        chunkVersions: [{ cx: 0, cz: 0, fromVersion: 131, toVersion: 132 }]

    WsTimeSync:
      title: timeSync
      type: object
      required: [type, worldTime]
      properties:
        type:
          type: string
          const: timeSync
          description: 메시지 종류
        worldTime:
          type: integer
          format: int64
          description: 현재 월드 시각(틱)
      example: { type: timeSync, worldTime: 6100 }

    WsHealthUpdate:
      title: healthUpdate
      type: object
