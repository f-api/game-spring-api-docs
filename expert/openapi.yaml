openapi: 3.1.0
info:
  title: WebCraft 게임 서버 API
  version: 1.0.0
  description: |
    브라우저 3D 블록 게임 WebCraft의 서버 API다. 서버는 세 가지 일을 한다.

    - **정적 서빙**: `http://localhost:8080/`에서 완성된 게임 클라이언트를 내려준다.
    - **REST**: 플레이어 등록, 월드 목록·생성·삭제, 최근 채팅 조회처럼 한 번 묻고 한 번 답하는 경로.
    - **WebSocket**: `/ws/worlds/{worldId}`에서 이동·채팅·블록 편집처럼 실시간으로 오가는 경로.

    저장소는 두 가지다. MySQL에는 플레이어·월드·채팅과 블록 변경을 오래 보관하고, Redis에는
    지금 살아 있는 WebSocket 접속(presence)을 둔다. 인증 세션은 없으며 플레이어는 닉네임으로만 구분한다.

    ## 한눈에 보기

    | 메서드 | 경로 | 성공 | 하는 일 |
    | --- | --- | ---: | --- |
    | `POST` | [`/players`](#tag/플레이어/operation/createPlayer) | `201` | 플레이어 등록 |
    | `GET` | [`/worlds`](#tag/월드/operation/listWorlds) | `200` | 월드 목록과 입장 정보 |
    | `POST` | [`/worlds`](#tag/월드/operation/createWorld) | `201` | 월드 생성 (시드는 서버가 결정) |
    | `GET` | [`/worlds/{worldId}/chats`](#tag/채팅/operation/getRecentChats) | `200` | 최근 채팅 조회 |
    | `DELETE` | [`/worlds/{worldId}`](#tag/월드/operation/deleteWorld) | `204` | 월드 삭제 |
    | `DELETE` | [`/worlds/{worldId}/if-matches`](#tag/월드/operation/deleteWorldIfMatches) | `204` | 조건부 월드 삭제 (내부 전용) |
    | `WS` | [`/ws/worlds/{worldId}`](#section/웹소켓) | — | 실시간 통신 |

    ## 오류 응답

    실패한 요청은 상태 코드와 함께 오류 코드 하나만 담은 본문을 돌려준다. HTTP 상태와 요청 경로는
    응답에 이미 있고, 사람이 읽는 문구는 클라이언트가 코드에서 만든다.

    <SchemaDefinition schemaRef="#/components/schemas/ErrorResponse" />

    | `error` | 상태 | 언제 |
    | --- | ---: | --- |
    | `VALIDATION_FAILED` | `400` | 요청 필드가 길이·패턴 규칙에 어긋남, 또는 숫자여야 할 파라미터가 숫자가 아님 |
    | `INVALID_REQUEST_BODY` | `400` | 본문 JSON을 읽지 못했거나 알 수 없는 필드가 있음 |
    | `NOT_WORLD_OWNER` | `403` | 월드를 지울 권한이 없는 요청자 |
    | `WORLD_NOT_FOUND` | `404` | 존재하지 않는 월드 |
    | `PLAYER_NOT_FOUND` | `404` | 등록되지 않은 닉네임을 월드 소유자로 지정 |
    | `NOT_FOUND` | `404` | 맞는 API나 정적 자원이 없는 경로 |
    | `DUPLICATE_NICKNAME` | `409` | 이미 있는 닉네임 |
    | `WORLD_LIMIT_REACHED` | `409` | 월드가 이미 3개인 상태에서 생성 |
    | `WORLD_IN_USE` | `409` | 접속자가 있는 월드를 삭제 |
    | `INTERNAL_ERROR` | `500` | 예기치 못한 오류 |
    | `WORLD_BASELINE_INITIALIZING` | `503` | 서버 기동 직후 월드 준비가 끝나기 전. 잠시 뒤 다시 요청하면 된다 |

    알 수 없는 필드는 무시하지 않고 `400 INVALID_REQUEST_BODY`로 거절한다. 시각 필드는
    서버 시간대 기준 ISO 8601 문자열이고 시간대 표기는 없다(`2026-07-16T12:34:56`).

    ## 웹소켓

    REST가 한 번 묻고 한 번 답하는 통로라면 WebSocket은 게임이 켜져 있는 동안 계속 열려 있는 통로다.
    이동·채팅·블록 편집·전투가 모두 이 통로로 오간다.

    ### 연결

    ```
    ws://localhost:8080/ws/worlds/{worldId}?nickname=steve
    ```

    `worldId`는 REST로 만든 월드의 id, `nickname`은 REST로 등록한 플레이어의 닉네임이다.
    순서는 플레이어 등록(`POST /players`) → 월드 선택(`GET /worlds`) → WebSocket 접속이다.
    HTTPS 배포에서는 같은 경로를 `wss://`로 쓴다.

    핸드셰이크는 일단 받아들인 뒤, 문제가 있으면 연결 직후 아래 close code로 끊는다.

    | close code | 상황 |
    | ---: | --- |
    | `4000` | `nickname`이 없거나 등록되지 않은 닉네임 |
    | `4001` | 존재하지 않는 월드 |
    | `4002` | 같은 월드에 같은 닉네임이 이미 접속 중. 먼저 붙은 연결이 유지되고 나중 연결이 끊긴다 |

    Origin이 same-origin 또는 허용 목록(`http://localhost:[*]`, `http://127.0.0.1:[*]`)에 없으면
    close code 없이 핸드셰이크 단계에서 `403`이다.

    ### 메시지 형식

    모든 메시지는 문자열 `type` 필드를 가진 평평한 JSON 객체 하나다. 감싸는 봉투는 없다.

    ```json
    { "type": "chat", "content": "안녕" }
    ```

    JSON이 아니거나 모르는 `type`이면 `error` 메시지를 보내고 연결은 유지한다. 메시지 오류만으로는
    연결을 끊지 않는다.

    | `error.code` | 언제 |
    | --- | --- |
    | `INVALID_JSON` | 받은 텍스트가 JSON이 아님 |
    | `INVALID_MESSAGE` | JSON 객체가 아니거나 필드 형식 검증 실패 (필드 누락, 잘못된 타입, NaN·무한대) |
    | `UNKNOWN_TYPE` | `type`이 없거나 처리기가 없는 값 |
    | `INTERNAL_ERROR` | 처리 중 예기치 못한 서버 오류. 연결은 유지 |
    | `EDIT_REJECTED` | 블록 편집 거부(리치 초과·설치 불가·인벤토리 부족). 원상복구 `blockUpdate`가 함께 온다 |
    | `RATE_LIMITED` | 세션당 인바운드 예산(120msg/s, 버스트 240) 초과. 초과분은 버려지고 통지는 초당 한 번 |
    | `QUEUE_FULL` | 액션 큐 상한(플레이어당 256, 월드 4096) 초과. 다음 틱에 다시 받는다 |
    | `CHAT_COOLDOWN` | 채팅 쿨다운(세션당 1초) 안에 다시 보냄. 그 채팅은 저장·방송되지 않는다 |
    | `CHAT_RATE_LIMITED` | 플레이어 단위 도배 제한(10초에 5건) 초과. 그 채팅은 저장·방송되지 않는다 |

    ### 클라이언트 → 서버

    핸들러는 JSON 필드의 형식만 검사한다. 리치·사거리·쿨다운·인벤토리 보유 같은 게임 규칙은
    월드별 100ms 틱 루프가 판정한 뒤 결과를 방송한다. `chat`·`ping`·`emote`는 즉시 처리한다.

    | `type` | `type` 외 필드 | 규칙 |
    | --- | --- | --- |
    | `ping` | 없음 | 연결 유지 확인. 클라이언트가 15초마다 보낸다. 응답은 보낸 세션에만 `pong` |
    | `move` | `x, y, z, yaw, pitch, crouching, gliding` | 위치·시선·자세. `x,y,z`는 유한한 double, `yaw,pitch`는 유한한 float, `crouching`·`gliding`은 필수 boolean. 최대 10Hz, 값이 바뀔 때만 |
    | `chat` | `content` | 공백이 아닌 1~200자(UTF-16 code unit 기준). 저장 뒤 같은 월드 전원에게 `chat`으로 방송 |
    | `blockPlace` | `x, y, z, blockType, state, hand` | 블록 설치. 좌표·`blockType`은 int32, `state`는 0~255, `hand`는 `main` 또는 `offhand` |
    | `blockBreak` | `x, y, z` | 블록 파괴(`blockType: 0`으로 변경) |
    | `mineHit` | `x, y, z` | 채굴 타격 후보. 유효한 타격만 `worldSound{kind:"block_hit"}`로 확정 |
    | `interact` | `x, y, z, hand` | 문·상자·침대 같은 블록 상호작용 |
    | `mobInteract` | `mobId, hand` | 몹 우클릭. `mobId`는 int64 |
    | `attack` | `mobId, sprinting` | 근접 공격. `sprinting`은 필수 boolean |
    | `selectSlot` | `slot` | 핫바 선택 슬롯(0~8) 변경 |
    | `respawn` | 없음 | 사망 상태에서 리스폰 요청 |
    | `leaveWorld` | 없음 | 메뉴로 나가기. 서버가 상태와 닉네임 점유를 정리한 뒤 `worldLeaveReady`로 확정 |
    | `emote` | 없음 | 손 흔들기 연출. 세션당 3초 쿨다운, 초과분은 조용히 버린다 |

    ```json
    { "type": "move", "x": 12.5, "y": 65.0, "z": -3.0, "yaw": 1.57, "pitch": -0.2, "crouching": false, "gliding": false }
    { "type": "chat", "content": "여기 다이아 있어요!" }
    { "type": "blockPlace", "x": 10, "y": 64, "z": 5, "blockType": 81, "state": 2, "hand": "main" }
    { "type": "blockBreak", "x": 10, "y": 64, "z": 5 }
    { "type": "attack", "mobId": 42, "sprinting": false }
    ```

    ### 서버 → 클라이언트

    | `type` | 필드 | 언제 |
    | --- | --- | --- |
    | `welcome` | `self, worldTime, dayCount, players, mobs, items, weather, difficulty, …` | 접속 성공 직후 나에게만 한 번. `self`에는 내 위치·체력·인벤토리가 들어 있다 |
    | `pong` | 없음 | `ping` 응답. 보낸 세션에만 |
    | `error` | `code` | 메시지 단위 오류. 연결은 유지 |
    | `playerJoin` | `nickname` | 다른 플레이어 접속. 새 접속자를 제외한 전원에게 |
    | `playerLeave` | `nickname` | 누군가 연결을 끊었을 때 |
    | `playerMoves` | `players: [{nickname, x, y, z, yaw, pitch, …}]` | 틱마다 그동안 움직인 플레이어만 묶어서 |
    | `chat` | `sender, content, timestamp` | 채팅이 저장되어 월드에 퍼질 때. 보낸 사람 포함 전원에게 |
    | `blockUpdate` | `blocks: [{x, y, z, blockType, state, revision}], chunkVersions` | 블록 변경. 보낸 사람 포함 전원에게 에코. 거부된 편집은 원래 값으로 되돌리는 갱신이 온다 |
    | `timeSync` | `worldTime` | 100틱마다 |
    | `healthUpdate` | `health, cause, hunger, saturationMilli` | 내 체력·허기 변경 |
    | `respawn` | `x, y, z, health` | 내 리스폰 확정. 클라이언트가 보내는 `respawn`은 요청(필드 없음)이고 서버가 보내는 `respawn`은 확정이다 |
    | `playerRespawn` | `nickname, x, y, z` | 리스폰 방송 |
    | `inventoryUpdate` | `inventory, offhand, selectedSlot` | 내 인벤토리 갱신 |
    | `weatherState` | `kind` | 날씨 전환. `clear`, `rain`, `thunder` |
    | `worldLeaveReady` | 없음 | `leaveWorld` 처리 완료. 이 뒤에야 메뉴로 돌아가고 재입장할 수 있다 |
    | `emote` | `nickname` | 손 흔들기 방송 |

    몹·투사체·제작·상자·화로·거래 등 게임플레이 메시지는 모두 제공 엔진이 보내며 백여 종이 있다.
    전체 목록과 필드는 배포판의 `docs/API.md` 4장에 있고, 정확한 wire 필드의 정본은
    `WsMessages.java`와 `client/src/net/Protocol.ts`다.

    ### 접속 흐름

    1. 서버가 닉네임·월드·중복 접속을 검증한다. 실패하면 `4000`/`4001`/`4002`로 끊는다.
    2. 성공하면 Redis presence에 연결을 등록하고 MySQL에서 플레이어 상태를 찾거나 새로 만든다.
    3. 나에게 `welcome`을 한 번 보내고, 나를 제외한 전원에게 `playerJoin`을 방송한다.
    4. 접속 중에는 presence 만료(90초)를 30초마다 heartbeat로 연장한다. 클라이언트는 15초마다 `ping`을 보낸다.
    5. 연결이 끊기면 마지막 상태를 저장하고 presence에서 제거한 뒤 `playerLeave`를 방송한다.

servers:
  - url: http://localhost:8080
tags:
  - name: 플레이어
    description: 닉네임 등록
  - name: 월드
    description: 월드 목록, 생성, 삭제
  - name: 채팅
    description: 최근 채팅 조회

paths:
  /players:
    post:
      tags: [플레이어]
      summary: 플레이어 등록
      description: |
        닉네임으로 플레이어 한 명을 등록한다. WebSocket 접속과 월드 소유자 지정에 앞서 반드시
        등록되어 있어야 한다. 같은 닉네임을 동시에 보내도 하나만 저장되고 나머지는 `409`다.
      operationId: createPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
            example:
              nickname: steve
      responses:
        '201':
          description: 등록 완료. 본문 없음.
        '400':
          description: 닉네임이 2~12자·영문 숫자 밑줄 규칙에 어긋남
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_FAILED
        '409':
          description: 이미 있는 닉네임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: DUPLICATE_NICKNAME

  /worlds:
    get:
      tags: [월드]
      summary: 월드 목록 조회
      description: |
        접속할 수 있는 월드 목록과 입장에 필요한 시드를 한 번에 돌려준다. 월드는 최대 3개다.
        `onlineCount`는 DB가 아니라 Redis presence에서 읽은 현재 접속 수다. 월드가 없으면 빈 배열이다.
      operationId: listWorlds
      responses:
        '200':
          description: 월드 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorldSummaryResponse'
              example:
                - id: 1
                  name: 내 첫 월드
                  seed: -1734829183
                  onlineCount: 3
                  difficulty: normal
                - id: 2
                  name: 친구들과
                  seed: 928341
                  onlineCount: 0
                  difficulty: hard
        '503':
          description: 서버 기동 직후 월드 준비가 끝나기 전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: WORLD_BASELINE_INITIALIZING
    post:
      tags: [월드]
      summary: 월드 생성
      description: |
        새 월드를 만든다. 시드는 요청으로 받지 않고 서버가 signed int32 범위에서 정한다.
        전체 월드는 최대 3개이며, 동시에 여러 생성 요청이 와도 상한을 넘지 않는다.

        `nickname`을 보내면 그 플레이어가 월드 소유자가 되고 이후 삭제 권한의 기준이 된다.
        생략하면 소유자 없는 월드가 되어 그 월드에서 플레이한 참여자만 지울 수 있다.
      operationId: createWorld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorldRequest'
            example:
              name: 내 첫 월드
              difficulty: normal
              nickname: steve
      responses:
        '201':
          description: 생성된 월드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWorldResponse'
              example:
                id: 4
                name: 내 첫 월드
                seed: -1734829183
                difficulty: normal
                ownerNickname: steve
        '400':
          description: 이름 규칙 위반(`VALIDATION_FAILED`), 알 수 없는 난이도나 알 수 없는 필드(`INVALID_REQUEST_BODY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_REQUEST_BODY
        '404':
          description: 등록되지 않은 `nickname`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: PLAYER_NOT_FOUND
        '409':
          description: 월드가 이미 3개
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: WORLD_LIMIT_REACHED

  /worlds/{worldId}/chats:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [채팅]
      summary: 최근 채팅 조회
      description: |
        월드에 처음 들어갈 때 최근 대화를 불러온다. 최신 `limit`건을 골라 오래된 순서(옛날 → 최신)로
        돌려준다. `limit`이 1~100을 벗어나면 오류가 아니라 서버가 범위 안으로 보정한다.
      operationId: getRecentChats
      parameters:
        - name: limit
          in: query
          required: false
          description: 가져올 최대 건수. 1 미만이나 100 초과는 1~100으로 보정된다. 숫자가 아니면 `400`
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 오래된 순서의 채팅 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageResponse'
              example:
                - sender: steve
                  content: 안녕하세요
                  createdAt: '2026-07-16T12:30:00'
                - sender: alex
                  content: 반가워요
                  createdAt: '2026-07-16T12:30:05'
        '400':
          description: '`limit`이 숫자가 아님'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_FAILED
        '404':
          $ref: '#/components/responses/WorldNotFound'

  /worlds/{worldId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    delete:
      tags: [월드]
      summary: 월드 삭제
      description: |
        월드와 거기 딸린 데이터(채팅, 변경 블록, 플레이어 상태, 상자·화로·몹)를 함께 지운다.
        파괴적 요청이므로 요청자를 `nickname`으로 밝혀야 한다.

        권한 규칙은 순서대로 적용된다.
        1. 소유자가 기록된 월드는 소유자만 지울 수 있다.
        2. 소유자가 없는 월드는 그 월드에서 플레이한 참여자만 지울 수 있다.
        3. 소유자도 참여자도 없는 빈 월드는 등록된 플레이어 누구나 지울 수 있다.

        접속자가 있거나 서버가 그 월드의 종료 저장을 마치는 중이면 지울 수 없다.
      operationId: deleteWorld
      parameters:
        - $ref: '#/components/parameters/RequesterNickname'
      responses:
        '204':
          description: 삭제 완료. 본문 없음.
        '403':
          $ref: '#/components/responses/NotWorldOwner'
        '404':
          $ref: '#/components/responses/WorldNotFound'
        '409':
          $ref: '#/components/responses/WorldInUse'

  /worlds/{worldId}/if-matches:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    delete:
      tags: [월드]
      summary: 조건부 월드 삭제
      description: |
        호출자가 마지막으로 본 월드 정체성(이름·시드·난이도·소유자)이 지금도 그대로일 때만 지운다.
        그 사이 월드가 지워지고 같은 id로 다시 만들어진 경우를 막기 위한 내부 전용 API이며,
        권한 규칙과 오류는 월드 삭제와 같다. 정체성이 다르면 아무것도 지우지 않고 `404`다.
      operationId: deleteWorldIfMatches
      parameters:
        - $ref: '#/components/parameters/RequesterNickname'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionalWorldDeleteRequest'
            example:
              name: 내 첫 월드
              seed: -1734829183
              difficulty: normal
              ownerNickname: steve
      responses:
        '204':
          description: 삭제 완료. 본문 없음.
        '400':
          description: 본문 필드 누락이나 규칙 위반
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_FAILED
        '403':
          $ref: '#/components/responses/NotWorldOwner'
        '404':
          $ref: '#/components/responses/WorldNotFound'
        '409':
          $ref: '#/components/responses/WorldInUse'

components:
  parameters:
    WorldId:
      name: worldId
      in: path
      required: true
      description: 월드의 고유 식별자
      schema:
        type: integer
        format: int64
        example: 1
    RequesterNickname:
      name: nickname
      in: query
      required: true
      description: 요청한 플레이어의 닉네임. 없거나 등록되지 않았으면 `403`
      schema:
        type: string
        example: steve

  responses:
    WorldNotFound:
      description: 존재하지 않는 월드
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: WORLD_NOT_FOUND
    NotWorldOwner:
      description: 닉네임 누락, 미등록 닉네임, 또는 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NOT_WORLD_OWNER
    WorldInUse:
      description: 접속자가 있거나 종료 저장 중인 월드
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: WORLD_IN_USE

  schemas:
    CreatePlayerRequest:
      title: 플레이어 등록 요청
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          description: 영문 대소문자, 숫자, 밑줄만 쓸 수 있다. 한글은 허용하지 않는다.
          minLength: 2
          maxLength: 12
          pattern: '^[a-zA-Z0-9_]+$'
          example: steve

    CreateWorldRequest:
      title: 월드 생성 요청
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 월드 이름. 공백만으로 된 값은 허용하지 않는다.
          minLength: 1
          maxLength: 30
          example: 내 첫 월드
        difficulty:
          type: string
          description: 난이도. 생략하면 `normal`
          enum: [easy, normal, hard]
          default: normal
          x-enumDescriptions:
            easy: 쉬움
            normal: 보통. 기본값
            hard: 어려움
        nickname:
          type: string
          description: 만든 사람의 닉네임. 등록된 플레이어여야 하며 월드 소유자가 된다. 생략하면 소유자 없는 월드.
          minLength: 2
          maxLength: 12
          example: steve

    CreatedWorldResponse:
      title: 생성된 월드
      type: object
      required: [id, name, seed, difficulty, ownerNickname]
      properties:
        id:
          type: integer
          format: int64
          description: 새 월드의 고유 식별자
          example: 4
        name:
          type: string
          description: 저장된 월드 이름
          example: 내 첫 월드
        seed:
          type: integer
          format: int32
          description: 서버가 정한 지형 시드
          example: -1734829183
        difficulty:
          type: string
          description: 확정된 난이도
          enum: [easy, normal, hard]
          example: normal
        ownerNickname:
          type: [string, 'null']
          description: 소유자 닉네임. 요청에 `nickname`이 없었으면 `null`
          example: steve

    WorldSummaryResponse:
      title: 월드 요약
      type: object
      required: [id, name, seed, onlineCount, difficulty]
      properties:
        id:
          type: integer
          format: int64
          description: 월드의 고유 식별자
          example: 1
        name:
          type: string
          description: 월드 이름
          example: 내 첫 월드
        seed:
          type: integer
          format: int32
          description: 지형 시드. 클라이언트가 같은 지형을 그리는 데 쓴다
          example: -1734829183
        onlineCount:
          type: integer
          description: 지금 접속 중인 플레이어 수. Redis presence 기준
          example: 3
        difficulty:
          type: string
          description: 난이도
          enum: [easy, normal, hard]
          example: normal

    ChatMessageResponse:
      title: 채팅 메시지
      type: object
      required: [sender, content, createdAt]
      properties:
        sender:
          type: string
          description: 보낸 플레이어 닉네임
          example: steve
        content:
          type: string
          description: 내용
          example: 안녕하세요
        createdAt:
          type: string
          description: 저장 시각. 서버 시간대 기준 ISO 8601, 시간대 표기 없음
          example: '2026-07-16T12:30:00'

    ConditionalWorldDeleteRequest:
      title: 조건부 삭제 요청
      type: object
      description: 호출자가 마지막으로 본 월드의 정체성. 네 값이 모두 지금 월드와 같아야 지운다.
      required: [name, seed, difficulty, ownerNickname]
      properties:
        name:
          type: string
          maxLength: 30
          example: 내 첫 월드
        seed:
          type: integer
          format: int32
          example: -1734829183
        difficulty:
          type: string
          enum: [easy, normal, hard]
          example: normal
        ownerNickname:
          type: string
          minLength: 2
          maxLength: 12
          pattern: '^[A-Za-z0-9_]+$'
          example: steve

    ErrorResponse:
      title: 오류 응답
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 프로그램이 구분하기 위한 오류 코드. 목록은 오류 응답 절에 있다
          example: WORLD_NOT_FOUND
