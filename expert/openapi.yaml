          description: 메시지 종류
        nickname:
          type: string
          description: 나간 플레이어
      example: { type: playerLeave, nickname: alex }

    WsPlayerMoves:
      title: playerMoves
      type: object
      required: [type, players]
      properties:
        type:
          type: string
          const: playerMoves
          description: 메시지 종류
        players:
          type: array
          description: 이번 틱에 움직인 플레이어들
          items:
            $ref: '#/components/schemas/WsPlayerPose'
