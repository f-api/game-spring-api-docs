# HTML 명세 갱신: ruby scripts/build-api-docs.rb
openapi: 3.1.0
info:
  title: WebCraft 과제 API
  version: 2.0.0
  description: |
    `expert-assignment`에서 과제로 다루는 REST API와 WebSocket 메시지 명세다.
    플레이어 등록, 월드 목록과 생성, 채팅 조회 및 실시간 메시지 교환에 사용한다.

    ## 한눈에 보기

    | 메서드 | 경로 | 성공 | 하는 일 |
    | --- | --- | ---: | --- |
    | `POST` | [`/players`](#tag/플레이어/operation/createPlayer) | `201` | 플레이어 등록 |
    | `GET` | [`/worlds`](#tag/월드/operation/listWorlds) | `200` | 월드 목록 조회 |
    | `POST` | [`/worlds`](#tag/월드/operation/createWorld) | `201` | 월드 생성 |
    | `GET` | [`/worlds/{worldId}/chats`](#tag/채팅/operation/getRecentChats) | `200` | 최근 채팅 조회 |
    | `WS` | [`/ws/worlds/{worldId}`](#section/웹소켓-연결) | `101` | WebSocket 연결 |

    ## 오류 응답

    REST 요청이 실패하면 HTTP 상태 코드와 함께 `error` 필드를 반환한다.
    공통 오류 처리는 제공되며, 각 API에서 확인할 응답은 아래와 같다.

    <SchemaDefinition schemaRef="#/components/schemas/ErrorResponse" />

    | `error` | 상태 | 언제 |
    | --- | ---: | --- |
    | `VALIDATION_FAILED` | `400` | 필수 값 누락, 길이·패턴 위반 또는 잘못된 숫자 파라미터 |
    | `INVALID_REQUEST_BODY` | `400` | 잘못된 JSON, 알 수 없는 필드 또는 난이도 |
    | `WORLD_NOT_FOUND` | `404` | 존재하지 않는 월드 |
    | `PLAYER_NOT_FOUND` | `404` | 등록되지 않은 닉네임으로 월드 생성 |
    | `DUPLICATE_NICKNAME` | `409` | 이미 등록된 닉네임 |
    | `WORLD_LIMIT_REACHED` | `409` | 월드가 이미 3개인 상태에서 생성 |
    | `INTERNAL_ERROR` | `500` | 예기치 못한 서버 오류 |
    | `WORLD_BASELINE_INITIALIZING` | `503` | 서버 기동 직후 월드 준비가 끝나기 전 |

    REST 요청의 알 수 없는 필드는 `400 INVALID_REQUEST_BODY`로 거절한다.
    시각은 서버 시간대 기준 ISO 8601 문자열이며 시간대 표기는 없다(`2026-07-16T12:34:56`).

    ## 웹소켓 연결

    ```
    ws://localhost:8080/ws/worlds/{worldId}?nickname=steve
    ```

    - `worldId`: 월드 목록이나 월드 생성 응답에서 받은 `id`.
    - `nickname`: `POST /players`로 등록한 플레이어의 닉네임.

    플레이어를 등록하고 월드를 선택한 뒤 연결한다. 월드가 없으면 먼저 `POST /worlds`로 생성한다.
    핸드셰이크에 성공하면 HTTP 상태 코드 `101 Switching Protocols`로 WebSocket 연결이 시작된다.

    닉네임과 월드 검사 결과가 잘못되었거나 닉네임이 중복되면 연결 직후 아래 종료 코드로 끊는다.

    | 종료 코드 | 상황 |
    | ---: | --- |
    | `4000` | 닉네임 누락 또는 등록되지 않은 닉네임 |
    | `4001` | 접속할 수 없는 월드 ID |
    | `4002` | 같은 월드에 같은 닉네임이 이미 접속 중. 기존 연결은 유지된다 |

    정상 종료에는 `1000`을 사용한다. 허용되지 않은 Origin의 요청은 핸드셰이크에서 `403`,
    서버의 월드 준비가 끝나기 전 요청은 `503`으로 거절된다.

    ### 메시지 형식

    문자열 `type` 필드를 가진 JSON 객체를 텍스트 메시지로 보낸다.
    JSON을 별도의 `data` 객체로 감싸지 않는다.

    ```json
    {"type":"chat","content":"안녕하세요"}
    ```

    WebSocket 메시지의 잘못된 JSON이나 필드, 처리할 수 없는 `type`은 아래의 `error` 응답으로 확인한다.
    게임 초기화는 제공 코드가 처리하며, 과제에서는 다음 요청과 응답을 다룬다.

    ## 클라이언트가 보내는 메시지

    ### ping · 연결 확인

    `{"type":"ping"}`을 보내면 같은 연결로 `pong`을 받는다.
    heartbeat 과제에서는 주기적으로 도착하는 이 메시지로 연결 상태를 확인한다.

    <SchemaDefinition schemaRef="#/components/schemas/WsPing" />

    ### chat · 채팅

    보낼 내용을 `content`에 담는다. 보낸 사람과 월드 ID는 연결 정보에서 가져오므로 본문에 넣지 않는다.
    내용은 1~200자이며 공백만 보내면 거절된다. 기본 제공 코드에서는 같은 연결의 채팅 사이에
    1초 간격이 필요하다. 전송 횟수 제한을 확장하는 과제의 기준은 과제 명세를 따른다.

    <SchemaDefinition schemaRef="#/components/schemas/WsChat" />

    ## 서버가 보내는 메시지

    ### pong · 연결 확인 응답

    `ping`을 보낸 연결에만 반환한다.

    <SchemaDefinition schemaRef="#/components/schemas/WsPong" />

    ### chat · 채팅 전송

    저장한 채팅을 같은 월드의 모든 연결에 전달한다. 보낸 사람도 수신 대상에 포함된다.
    저장 내역을 REST로 조회할 때의 시각 필드는 `createdAt`, WebSocket 응답에서는 `timestamp`다.

    <SchemaDefinition schemaRef="#/components/schemas/WsChatBroadcast" />

    ### error · 메시지 오류

    요청한 연결에 오류 코드를 반환한다. 해당 메시지의 오류 응답만으로 연결을 종료하지 않는다.
    과제에서 확인할 오류 코드는 아래와 같다.

    <SchemaDefinition schemaRef="#/components/schemas/WsError" />

servers:
  - url: http://localhost:8080
tags:
  - name: 플레이어
    description: 닉네임 등록
  - name: 월드
    description: 월드 목록과 생성
  - name: 채팅
    description: 최근 채팅 조회

paths:
  /players:
    post:
      tags: [플레이어]
      summary: 플레이어 등록
      description: |
        닉네임으로 플레이어 한 명을 등록한다. WebSocket 접속과 월드 소유자 지정에 앞서 반드시
        등록되어 있어야 한다. 같은 닉네임을 동시에 보내도 하나만 저장되고 나머지는 `409`다.
      operationId: createPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
            example:
              nickname: steve
      responses:
        '201':
          description: 등록 완료. 본문 없음.
        '400':
          description: 닉네임이 2~12자·영문 숫자 밑줄 규칙에 어긋남
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_FAILED
        '409':
          description: 이미 있는 닉네임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: DUPLICATE_NICKNAME

  /worlds:
    get:
      tags: [월드]
      summary: 월드 목록 조회
      description: |
        접속할 수 있는 월드 목록과 입장에 필요한 시드를 한 번에 돌려준다. 월드는 최대 3개다.
        `onlineCount`는 DB가 아니라 Redis presence에서 읽은 현재 접속 수다. 월드가 없으면 빈 배열이다.
      operationId: listWorlds
      responses:
        '200':
          description: 월드 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorldSummaryResponse'
              example:
                - id: 1
                  name: 내 첫 월드
                  seed: -1734829183
                  onlineCount: 3
                  difficulty: normal
                - id: 2
                  name: 친구들과
                  seed: 928341
                  onlineCount: 0
                  difficulty: hard
        '503':
          description: 서버 기동 직후 월드 준비가 끝나기 전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: WORLD_BASELINE_INITIALIZING
    post:
      tags: [월드]
      summary: 월드 생성
      description: |
        새 월드를 만든다. 시드는 요청으로 받지 않고 서버가 signed int32 범위에서 정한다.
        전체 월드는 최대 3개이며, 동시에 여러 생성 요청이 와도 상한을 넘지 않는다.

        `nickname`은 등록된 플레이어의 닉네임이다. 생략하면 응답의 `ownerNickname`은 `null`이다.
      operationId: createWorld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorldRequest'
            example:
              name: 내 첫 월드
              difficulty: normal
              nickname: steve
      responses:
        '201':
          description: 생성된 월드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWorldResponse'
              example:
                id: 4
                name: 내 첫 월드
                seed: -1734829183
                difficulty: normal
                ownerNickname: steve
        '400':
          description: 이름 규칙 위반(`VALIDATION_FAILED`), 알 수 없는 난이도나 알 수 없는 필드(`INVALID_REQUEST_BODY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_REQUEST_BODY
        '404':
          description: 등록되지 않은 `nickname`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: PLAYER_NOT_FOUND
        '409':
          description: 월드가 이미 3개
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: WORLD_LIMIT_REACHED
        '503':
          description: 서버 기동 직후 월드 준비가 끝나기 전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: WORLD_BASELINE_INITIALIZING

  /worlds/{worldId}/chats:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [채팅]
      summary: 최근 채팅 조회
      description: |
        월드에 처음 들어갈 때 최근 대화를 불러온다. 생성 시각 내림차순, 같은 시각이면 ID 내림차순으로 최신 `limit`건을 선택한 뒤 오래된 순서(옛날 → 최신)로
        돌려준다. `limit`이 1~100을 벗어나면 오류가 아니라 서버가 범위 안으로 보정한다.
      operationId: getRecentChats
      parameters:
        - name: limit
          in: query
          required: false
          description: 가져올 최대 건수. 1 미만이나 100 초과는 1~100으로 보정된다. 숫자가 아니면 `400`
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 오래된 순서의 채팅 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageResponse'
              example:
                - sender: steve
                  content: 안녕하세요
                  createdAt: '2026-07-16T12:30:00'
                - sender: alex
                  content: 반가워요
                  createdAt: '2026-07-16T12:30:05'
        '400':
          description: '`limit`이 숫자가 아님'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_FAILED
        '404':
          $ref: '#/components/responses/WorldNotFound'

  /practice/worlds/{worldId}/chats/rollback:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    post:
      tags: [채팅]
      summary: 저장 롤백 확인 (Lv 14 제공 도구)
      description: |
        `assignment-checks` 프로필에서만 등록되는 실습 API다. 채팅 저장 서비스를 호출한 뒤
        트랜잭션을 의도적으로 롤백한다. `204`를 받아도 채팅은 DB와 수신 화면에 남지 않아야 한다.
        기본 실행에서는 이 경로가 등록되지 않는다. 실제 등록된 닉네임과 월드 ID를 사용한다.
      operationId: checkChatRollback
      parameters:
        - name: nickname
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 12, pattern: '^[A-Za-z0-9_]+$'}
        - name: content
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '204':
          description: 저장 작업을 수행한 뒤 롤백 완료
        '404':
          $ref: '#/components/responses/WorldNotFound'

components:
  parameters:
    WorldId:
      name: worldId
      in: path
      required: true
      description: 월드의 고유 식별자. 숫자가 아니면 `400 VALIDATION_FAILED`
      schema:
        type: integer
        format: int64
        example: 1
  responses:
    WorldNotFound:
      description: 존재하지 않는 월드
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: WORLD_NOT_FOUND
  schemas:
    CreatePlayerRequest:
      title: 플레이어 등록 요청
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          description: 영문 대소문자, 숫자, 밑줄만 쓸 수 있다. 한글은 허용하지 않는다.
          minLength: 2
          maxLength: 12
          pattern: '^[a-zA-Z0-9_]+$'
          example: steve

    CreateWorldRequest:
      title: 월드 생성 요청
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 월드 이름. 공백만으로 된 값은 허용하지 않는다.
          minLength: 1
          maxLength: 30
          example: 내 첫 월드
        difficulty:
          type: string
          description: 난이도. 생략하면 `normal`
          enum: [easy, normal, hard]
          default: normal
          x-enumDescriptions:
            easy: 쉬움
            normal: 보통. 기본값
            hard: 어려움
        nickname:
          type: string
          description: 만든 사람의 닉네임. 등록된 플레이어여야 하며 월드 소유자가 된다. 생략하면 소유자 없는 월드.
          minLength: 2
          maxLength: 12
          example: steve

    CreatedWorldResponse:
      title: 생성된 월드
      type: object
      required: [id, name, seed, difficulty, ownerNickname]
      properties:
        id:
          type: integer
          format: int64
          description: 새 월드의 고유 식별자
          example: 4
        name:
          type: string
          description: 저장된 월드 이름
          example: 내 첫 월드
        seed:
          type: integer
          format: int32
          description: 서버가 정한 지형 시드
          example: -1734829183
        difficulty:
          type: string
          description: 확정된 난이도
          enum: [easy, normal, hard]
          example: normal
        ownerNickname:
          type: [string, 'null']
          description: 소유자 닉네임. 요청에 `nickname`이 없었으면 `null`
          example: steve

    WorldSummaryResponse:
      title: 월드 요약
      type: object
      required: [id, name, seed, onlineCount, difficulty]
      properties:
        id:
          type: integer
          format: int64
          description: 월드의 고유 식별자
          example: 1
        name:
          type: string
          description: 월드 이름
          example: 내 첫 월드
        seed:
          type: integer
          format: int32
          description: 월드의 지형을 결정하는 시드
          example: -1734829183
        onlineCount:
          type: integer
          description: 지금 접속 중인 플레이어 수. Redis presence 기준
          example: 3
        difficulty:
          type: string
          description: 난이도
          enum: [easy, normal, hard]
          example: normal

    ChatMessageResponse:
      title: 채팅 메시지
      type: object
      required: [sender, content, createdAt]
      properties:
        sender:
          type: string
          description: 보낸 플레이어 닉네임
          example: steve
        content:
          type: string
          description: 내용
          example: 안녕하세요
        createdAt:
          type: string
          description: 저장 시각. 서버 시간대 기준 ISO 8601, 시간대 표기 없음
          example: '2026-07-16T12:30:00'

    ErrorResponse:
      title: 오류 응답
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 프로그램이 구분하기 위한 오류 코드. 목록은 오류 응답 절에 있다
          example: WORLD_NOT_FOUND

    WsPing:
      title: ping
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: ping
          description: 메시지 종류
      example: { type: ping }

    WsChat:
      title: chat
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          const: chat
          description: 메시지 종류
        content:
          type: string
          description: 내용. 공백만으로 된 값은 거부. 길이는 UTF-16 code unit 기준
          minLength: 1
          maxLength: 200
      example: { type: chat, content: 여기 다이아 있어요! }

    WsError:
      title: error
      type: object
      required: [type, code]
      properties:
        type:
          type: string
          const: error
          description: 메시지 종류
        code:
          type: string
          description: 오류 코드
          enum: [INVALID_JSON, INVALID_MESSAGE, UNKNOWN_TYPE, INTERNAL_ERROR, CHAT_COOLDOWN]
          x-enumDescriptions:
            INVALID_JSON: 받은 텍스트를 JSON으로 읽을 수 없음
            INVALID_MESSAGE: JSON 객체가 아니거나 필수 필드와 값이 잘못됨
            UNKNOWN_TYPE: type이 없거나 처리할 핸들러가 없음
            INTERNAL_ERROR: 처리 중 예기치 못한 서버 오류
            CHAT_COOLDOWN: 같은 연결에서 1초 안에 다시 보낸 채팅. 저장하거나 전송하지 않음
      example: { type: error, code: UNKNOWN_TYPE }

    WsPong:
      title: pong
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: pong
          description: 메시지 종류
      example: { type: pong }

    WsChatBroadcast:
      title: chat (방송)
      type: object
      required: [type, sender, content, timestamp]
      properties:
        type:
          type: string
          const: chat
          description: 메시지 종류
        sender:
          type: string
          description: 보낸 플레이어 닉네임
        content:
          type: string
          description: 내용
        timestamp:
          type: string
          description: 저장 시각. 서버 시간대 기준 ISO 8601, 시간대 표기 없음
      example: { type: chat, sender: steve, content: 여기 다이아 있어요!, timestamp: '2026-07-16T12:30:00' }
